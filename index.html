<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>43型 作戦ボード</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* layout: toolbar on top; author pane and A4 preview pane side by side (tabs on phones); paper stays white for print */
:root{
  --bg:#EEF1F5;--surface:#FFFFFF;--ink:#111827;--muted:#5A6577;--line:#D6DBE3;
  --accent:#C8102E;--accent-ink:#FFFFFF;--desk:#D9DEE6;
  --f:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1217;--surface:#171C24;--ink:#EDF0F5;--muted:#9BA6B5;--line:#2A323E;
  --accent:#FF6477;--accent-ink:#2A0309;--desk:#0A0D11;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1217;--surface:#171C24;--ink:#EDF0F5;--muted:#9BA6B5;--line:#2A323E;
  --accent:#FF6477;--accent-ink:#2A0309;--desk:#0A0D11;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.6;
  padding-block:12px 40px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
h1{font-size:19px;line-height:1.3;margin:0;font-weight:700}
h2{font-size:15px;margin:0;font-weight:700}
.top{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.bar .sp{flex:1}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical}
select:focus-visible,input:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.btn{font:inherit;font-weight:500;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.status{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:99px;background:var(--muted);display:inline-block}
.dot.ok{background:#2E9E5B}.dot.warn{background:#D99A1B}
.err{color:var(--accent)}
.tabs{display:none;gap:4px}
.tabs .btn[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panes{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
.panes[data-pane="edit"] .pv{display:none}
.panes[data-pane="view"] .ed{display:none}
@media (max-width:999px){.tabs{display:flex}}
@media (min-width:1000px){
  .panes{grid-template-columns:minmax(380px,460px) minmax(0,1fr)}
  .panes[data-pane] .pv,.panes[data-pane] .ed{display:flex}
  .pv{position:sticky;top:8px}
}
.ed{display:flex;flex-direction:column;gap:10px;min-width:0}
.pv{flex-direction:column;gap:8px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.form .wide{grid-column:1/-1}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.ihead{display:flex;gap:6px;align-items:center}
.ihead .sp{flex:1}
.chip{font-size:12px;font-weight:700;border-radius:5px;padding:1px 9px}
.hint{margin:0;font-size:12px;color:var(--muted)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pvbox{background:var(--desk);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 110px);overflow-y:auto}
.pgl{font-size:12px;color:var(--muted);margin:0 0 4px}
.pgwrap{position:relative;overflow:hidden;box-shadow:0 1px 8px rgba(0,0,0,.25);background:#fff}
.pgwrap>.paper{position:absolute;left:0;top:0;transform-origin:0 0}
@media (max-width:999px){.pvbox{max-height:none}}
#holder{position:fixed;left:0;top:0;z-index:-1;pointer-events:none;width:1123px}

/* paper: fixed light colors so print output never changes with the viewer theme */
.paper{width:1123px;min-height:794px;background:#fff;color:#1B2230;padding:32px;font-family:var(--f);line-height:1.5;display:flex;flex-direction:column;gap:14px}
.paper *{box-sizing:border-box}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.pk{font-size:12px;color:#5A6577;letter-spacing:.08em}
.pt{font-size:30px;font-weight:700;line-height:1.3;margin:0;color:#1B2230}
.pm{display:flex;gap:8px}
.pm div{border:1px solid #CBD2DC;border-radius:6px;padding:4px 12px;min-width:110px}
.pm small{display:block;font-size:10px;color:#5A6577}
.pm span{font-size:14px;font-weight:700}
.aim{background:#F3F5F8;border-left:5px solid #1B2230;padding:8px 14px;font-size:14px;white-space:pre-wrap}
.aim small{font-size:11px;color:#5A6577;display:block}
.flow{position:relative;width:1059px}
.ln{position:absolute;top:0;border-radius:8px}
.lh{position:absolute;top:0;height:30px;border-radius:8px 8px 0 0;font-weight:700;font-size:14px;padding:3px 12px;display:flex;align-items:center;gap:10px}
.lh small{font-weight:400;font-size:12px}
.flow svg{position:absolute;left:0;top:0}
.nd{position:absolute;border:1.5px solid;border-radius:8px;background:#fff;padding:12px 10px 6px;overflow:hidden}
.nb{position:absolute;left:0;top:0;right:0;height:6px}
.n1{display:flex;align-items:center;gap:6px;height:22px}
.tg{font-size:11px;font-weight:700;border-radius:4px;padding:0 7px;line-height:18px}
.mk{font-size:12px;color:#5A6577}
.pr{margin-left:auto;font-size:14px;font-weight:700;font-family:var(--mono)}
.n2{font-size:17px;font-weight:700;font-family:var(--mono);line-height:22px}
.n3{font-size:12px;color:#3C4757;line-height:17px}
.n4{font-size:12px;line-height:17px;max-height:34px;overflow:hidden;margin-top:3px;color:#1B2230}
.pill{position:absolute;height:24px;border:1.5px solid;border-radius:99px;background:#fff;display:flex;align-items:center;gap:5px;padding:0 8px 0 3px;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;color:#1B2230}
.pill i{font-style:normal;width:18px;height:18px;border-radius:99px;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.empty{position:absolute;left:0;right:0;top:40px;text-align:center;color:#5A6577;font-size:15px}
.pf{font-size:11px;color:#5A6577;margin-top:auto}
.h2p{font-size:18px;font-weight:700;margin:0;border-bottom:2px solid #1B2230;padding-bottom:4px}
.lst{display:flex;gap:24px;align-items:flex-start}
.lc{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.rw{display:flex;gap:10px;align-items:flex-start}
.no{flex:none;width:24px;height:24px;border-radius:99px;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.rh{font-size:13px;font-weight:700;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.rh .lb{background:#F3F5F8;border:1px solid #CBD2DC;border-radius:5px;padding:0 8px;font-weight:500}
.tk{font-size:13px;margin-top:2px;white-space:pre-wrap}
.nt{border:1px solid #CBD2DC;border-radius:8px;padding:10px 14px;font-size:13px;white-space:pre-wrap}
</style>

</head>
<body>
<div class="top">
  <div class="bar">
    <h1>作戦表メーカー</h1>
    <span class="sp"></span>
    <button class="btn" data-act="newplan">新規</button>
    <button class="btn" data-act="sample">サンプル</button>
    <select id="plansel" aria-label="保存した作戦表"></select>
    <button class="btn" data-act="save" id="savebtn">保存</button>
    <button class="btn" data-act="del" id="delbtn">削除</button>
    <button class="btn pri" data-act="pdf" id="pdfbtn">PDFを出力</button>
  </div>
  <div class="status" id="status"></div>
  <div class="tabs"><button class="btn" data-act="pane" data-p="edit" aria-selected="true">作成</button><button class="btn" data-act="pane" data-p="view" aria-selected="false">プレビュー</button></div>
  <div class="panes" id="panes" data-pane="edit">
    <div class="ed" id="ed"></div>
    <div class="pv" id="pv"><div class="pvbox" id="pvbox"></div></div>
  </div>
</div>
<div id="holder"></div>
<datalist id="makers"><option value="シャープ"><option value="ソニー"><option value="パナソニック"><option value="REGZA"><option value="LG"><option value="ハイセンス"></datalist>

<script>
var TIERS=[
 {id:'STD',sub:'アテンション・入口',color:'#E0A100',text:'#3B2A00',tint:'#FFF6D9'},
 {id:'MID',sub:'ミドル・ステップアップ',color:'#2F6FDB',text:'#FFFFFF',tint:'#E8F0FD'},
 {id:'FLAG',sub:'ゴール・着地',color:'#D62839',text:'#FFFFFF',tint:'#FDE9EC'}
];
var KEYL='tv43plans-v3';
var db=null,dlcap=null,plans=[],local={};
var st={cur:null,pane:'edit',dirty:false,status:'local',canWrite:null,msg:'',err:'',busy:false,touched:false,saved:false};

function $(s){return document.querySelector(s)}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function uid(p){return p+Math.random().toString(36).slice(2,8)}
function tier(id){return TIERS.filter(function(t){return t.id===id})[0]||TIERS[0]}
function yen(n){return (n===''||n==null||isNaN(Number(n)))?'':'¥'+Number(n).toLocaleString('ja-JP')}
function clone(o){return JSON.parse(JSON.stringify(o))}
function nlabel(n){return n.tier+' '+(n.model||n.name||'（未入力）')}

function samplePlan(){
  return {id:uid('p'),title:'43型 週末コンサル作戦',period:'11/21(土)・11/22(日)',store:'駅前店',author:'店長',
   aim:'安さで入り、使い方で上げる。ゲーム・映画の相談はFLAGへ。配信の相談はMIDで音と画質を比べる。',
   nodes:[
    {id:'n1',tier:'STD',maker:'シャープ',model:'AQ-43S1',name:'43型 4K 標準',price:54800,point:'今週の目玉。まず大画面の価格で足を止める。'},
    {id:'n2',tier:'STD',maker:'シャープ',model:'AQ-43S2',name:'43型 4K 録画対応',price:59800,point:'録画したい人の入口。'},
    {id:'n3',tier:'MID',maker:'パナソニック',model:'VX-43P3',name:'43型 4K 配信と音',price:79800,point:'配信と音の差を、実機で並べて比べる。'},
    {id:'n4',tier:'FLAG',maker:'ソニー',model:'KD-43B5',name:'43型 4K 120Hz ゲーム',price:109800,point:'ゲーム機があるなら迷わずこれ。'},
    {id:'n5',tier:'FLAG',maker:'ソニー',model:'KD-43B4',name:'43型 4K 高画質',price:98000,point:'映画や配信を、暗い場面で見せる。'}
   ],
   edges:[
    {id:'e1',from:'n1',to:'n3',label:'配信を見る',talk:'「ふだん動画は何で見ますか？」配信が多いと分かったら、画面の綺麗さと音の差を並べて見せる。'},
    {id:'e2',from:'n3',to:'n5',label:'映画が好き',talk:'暗い場面の映像で画質差を体感してもらう。差額は月あたりで伝える。'},
    {id:'e3',from:'n1',to:'n4',label:'ゲームする',talk:'MIDは飛ばしてFLAGへ。機種を聞いて、120Hzと低遅延を触ってもらう。'},
    {id:'e4',from:'n2',to:'n3',label:'録画も使う',talk:'録画の使い方を聞き、HDDとあわせて配信機能の便利さを見せる。'},
    {id:'e5',from:'n3',to:'n4',label:'ゲーム機あり',talk:'配信より先にゲーム機の機種を聞き、FLAGの低遅延へつなぐ。'}
   ],
   notes:'・土曜の午前は混むので、まずSTDで声かけを優先する。\n・FLAGの値引きは店長承認。\n・延長保証5年を必ず一言添える。',updated:0};
}
function blankPlan(){return {id:uid('p'),title:'',period:'',store:'',author:'',aim:'',nodes:[],edges:[],notes:'',updated:0}}

/* ---------- layout and sheet ---------- */
function layout(p){
  var cols=TIERS.filter(function(t){return p.nodes.some(function(n){return n.tier===t.id})});
  var n=cols.length||1,inner=1059,colW=inner/n,nodeW=n===1?320:n===2?290:232,NH=128,PITCH=168,TOP=44,map={},rows=0;
  cols.forEach(function(t,ci){
    var list=p.nodes.filter(function(x){return x.tier===t.id});rows=Math.max(rows,list.length);
    list.forEach(function(nd,ri){map[nd.id]={nd:nd,ci:ci,x:ci*colW+colW/2-nodeW/2,y:TOP+ri*PITCH,w:nodeW,h:NH}});
  });
  return {cols:cols,colW:colW,nodeW:nodeW,map:map,flowH:TOP+Math.max(rows,1)*PITCH-20};
}
function cub(a,b,c,d,t){var u=1-t;return u*u*u*a+3*u*u*t*b+3*u*t*t*c+t*t*t*d}
function edgeGeoms(p,L){
  var list=[],cnt={},tot={};
  p.edges.forEach(function(e,i){
    var a=L.map[e.from],b=L.map[e.to];if(!a||!b||a===b)return;
    var dir=b.ci>a.ci?1:(b.ci<a.ci?-1:0);
    list.push({e:e,i:i,a:a,b:b,dir:dir,sa:dir>=0?'R':'L',sb:dir>0?'L':'R'});
  });
  list.forEach(function(g){var ka=g.a.nd.id+g.sa,kb=g.b.nd.id+g.sb;tot[ka]=(tot[ka]||0)+1;tot[kb]=(tot[kb]||0)+1});
  list.forEach(function(g){
    var ka=g.a.nd.id+g.sa,kb=g.b.nd.id+g.sb;
    var ia=(cnt[ka]=(cnt[ka]===undefined?0:cnt[ka]+1)),ib=(cnt[kb]=(cnt[kb]===undefined?0:cnt[kb]+1));
    var oa=(ia-(tot[ka]-1)/2)*16,ob=(ib-(tot[kb]-1)/2)*16;
    var x1=g.sa==='R'?g.a.x+g.a.w:g.a.x,y1=g.a.y+g.a.h/2+oa;
    var x2=g.sb==='R'?g.b.x+g.b.w:g.b.x,y2=g.b.y+g.b.h/2+ob;
    var c1x,c2x,dx;
    if(g.dir>0){dx=Math.max(40,(x2-x1)*.5);c1x=x1+dx;c2x=x2-dx}
    else if(g.dir<0){dx=Math.max(40,(x1-x2)*.5);c1x=x1-dx;c2x=x2+dx}
    else{c1x=x1+70;c2x=x2+70}
    var bow=Math.abs(g.b.ci-g.a.ci)>1?100:0,c1y=y1+bow,c2y=y2+bow;
    g.p=[x1,y1,c1x,c1y,c2x,c2y,x2,y2];
    g.mx=cub(x1,c1x,c2x,x2,.5);g.my=cub(y1,c1y,c2y,y2,.5);
  });
  return list;
}
function sheetFlow(p){
  var L=layout(p),G=edgeGeoms(p,L),h='';
  if(!p.nodes.length)return '<div class="flow" style="height:160px"><div class="empty">作成画面で機種を追加すると、ここにコンサルの流れが出ます。</div></div>';
  L.cols.forEach(function(t,ci){
    h+='<div class="ln" style="left:'+(ci*L.colW+4)+'px;width:'+(L.colW-8)+'px;height:'+L.flowH+'px;background:'+t.tint+'"></div>'+
       '<div class="lh" style="left:'+(ci*L.colW+4)+'px;width:'+(L.colW-8)+'px;background:'+t.color+';color:'+t.text+'">'+t.id+'<small>'+t.sub+'</small></div>';
  });
  var svg='<svg width="1059" height="'+L.flowH+'" viewBox="0 0 1059 '+L.flowH+'">';
  G.forEach(function(g){
    var c=tier(g.b.nd.tier).color,q=g.p;
    svg+='<path d="M'+q[0]+' '+q[1]+' C'+q[2]+' '+q[3]+' '+q[4]+' '+q[5]+' '+q[6]+' '+q[7]+'" fill="none" stroke="'+c+'" stroke-width="2.4"/>';
    var tx=q[6]-q[4],ty=q[7]-q[5],m=Math.sqrt(tx*tx+ty*ty)||1;tx/=m;ty/=m;
    var bx=q[6]-12*tx,by=q[7]-12*ty,nx=-ty*6,ny=tx*6;
    svg+='<polygon points="'+q[6]+','+q[7]+' '+(bx+nx)+','+(by+ny)+' '+(bx-nx)+','+(by-ny)+'" fill="'+c+'"/>';
  });
  svg+='</svg>';
  h+=svg;
  Object.keys(L.map).forEach(function(k){
    var o=L.map[k],n=o.nd,t=tier(n.tier);
    h+='<div class="nd" style="left:'+o.x+'px;top:'+o.y+'px;width:'+o.w+'px;height:'+o.h+'px;border-color:'+t.color+'"><i class="nb" style="background:'+t.color+'"></i>'+
      '<div class="n1"><span class="tg" style="background:'+t.color+';color:'+t.text+'">'+n.tier+'</span><span class="mk">'+esc(n.maker)+'</span><b class="pr">'+yen(n.price)+'</b></div>'+
      '<div class="n2">'+esc(n.model||'（型番）')+'</div><div class="n3">'+esc(n.name)+'</div><div class="n4">'+esc(n.point)+'</div></div>';
  });
  var placed=[];
  G.forEach(function(g){
    var lab=String(g.e.label||'');if(lab.length>7)lab=lab.slice(0,7)+'…';
    var w=Math.max(40,Math.round(lab.length*12+36)),x=g.mx-w/2,y=g.my-12,tries=0;
    while(tries<6&&placed.some(function(r){return Math.abs(r.x-x)<(r.w+w)/2&&Math.abs(r.y-y)<26})){y+=26;tries++}
    placed.push({x:x,y:y,w:w});
    var c=tier(g.b.nd.tier).color;
    h+='<div class="pill" style="left:'+x+'px;top:'+y+'px;width:'+w+'px;border-color:'+c+'"><i style="background:'+c+'">'+(g.i+1)+'</i>'+esc(lab)+'</div>';
  });
  return '<div class="flow" style="height:'+L.flowH+'px">'+h+'</div>';
}
function pageOne(p){
  var d=new Date().toLocaleDateString('ja-JP');
  return '<div class="paper"><div class="ph"><div><div class="pk">週間コンサル作戦表</div><h2 class="pt">'+esc(p.title||'（タイトル未入力）')+'</h2></div>'+
   '<div class="pm"><div><small>対象日</small><span>'+esc(p.period||'-')+'</span></div><div><small>店舗</small><span>'+esc(p.store||'-')+'</span></div><div><small>作成者</small><span>'+esc(p.author||'-')+'</span></div></div></div>'+
   (p.aim?'<div class="aim"><small>今週の狙い</small>'+esc(p.aim)+'</div>':'')+
   sheetFlow(p)+'<div class="pf">矢印の番号は2ページ目の「コンサルの流れ」に対応します。 出力日 '+d+'</div></div>';
}
function pageTwo(p){
  var L=layout(p),items=[];
  p.edges.forEach(function(e,i){
    var a=L.map[e.from],b=L.map[e.to];if(!a||!b||a===b)return;
    var ta=tier(a.nd.tier),tb=tier(b.nd.tier);
    items.push('<div class="rw"><span class="no" style="background:'+tb.color+';color:'+tb.text+'">'+(i+1)+'</span><div><div class="rh"><span class="tg" style="background:'+ta.color+';color:'+ta.text+'">'+a.nd.tier+'</span>'+esc(a.nd.model)+'<span>→</span><span class="tg" style="background:'+tb.color+';color:'+tb.text+'">'+b.nd.tier+'</span>'+esc(b.nd.model)+
      (e.label?'<span class="lb">'+esc(e.label)+'</span>':'')+'</div>'+(e.talk?'<div class="tk">'+esc(e.talk)+'</div>':'')+'</div></div>');
  });
  if(!items.length&&!p.notes)return null;
  var half=Math.ceil(items.length/2);
  return '<div class="paper"><div class="ph"><div><div class="pk">'+esc(p.title||'')+'</div><h2 class="pt" style="font-size:24px">コンサルの流れ</h2></div></div>'+
   (items.length?'<div class="lst"><div class="lc">'+items.slice(0,half).join('')+'</div><div class="lc">'+items.slice(half).join('')+'</div></div>':'')+
   (p.notes?'<div><h2 class="h2p" style="margin-bottom:8px">注意点・共有事項</h2><div class="nt">'+esc(p.notes)+'</div></div>':'')+'</div>';
}
function pagesHtml(p){var a=[pageOne(p)],b=pageTwo(p);if(b)a.push(b);return a}

/* ---------- preview ---------- */
var raf=0;
function schedulePreview(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;renderPreview()})}
function renderPreview(){
  var box=$('#pvbox'),pages=pagesHtml(st.cur);
  box.innerHTML=pages.map(function(h,i){return '<div><p class="pgl">'+(i===0?'1ページ目 コンサルフロー':'2ページ目 コンサルの流れ')+'</p><div class="pgwrap">'+h+'</div></div>'}).join('');
  fit();
}
function fit(){
  var box=$('#pvbox');if(!box)return;
  var w=box.clientWidth-20;if(w<=0)return;var s=Math.min(1,w/1123);
  [].forEach.call(box.querySelectorAll('.pgwrap'),function(wr){
    var pp=wr.firstElementChild;pp.style.transform='scale('+s+')';
    wr.style.width=(1123*s)+'px';wr.style.height=(pp.offsetHeight*s)+'px';
  });
}
if(window.ResizeObserver){new ResizeObserver(function(){fit()}).observe($('#pvbox'))}
window.addEventListener('resize',fit);

/* ---------- author pane ---------- */
function nodeCard(n){
  var t=tier(n.tier);
  return '<div class="item"><div class="ihead"><select data-nid="'+n.id+'" data-f="tier" style="background:'+t.color+';color:'+t.text+';font-weight:700">'+TIERS.map(function(x){return '<option value="'+x.id+'"'+(x.id===n.tier?' selected':'')+'>'+x.id+'</option>'}).join('')+'</select><span class="hint">'+t.sub+'</span><span class="sp"></span>'+
   '<button class="btn sm" data-act="nup" data-id="'+n.id+'" aria-label="上へ">↑</button><button class="btn sm" data-act="ndown" data-id="'+n.id+'" aria-label="下へ">↓</button><button class="btn sm" data-act="ndel" data-id="'+n.id+'" aria-label="削除">削除</button></div>'+
   '<div class="form"><label>メーカー<input list="makers" data-nid="'+n.id+'" data-f="maker" value="'+esc(n.maker)+'"></label>'+
   '<label>型番<input data-nid="'+n.id+'" data-f="model" value="'+esc(n.model)+'"></label>'+
   '<label>商品名・特徴<input data-nid="'+n.id+'" data-f="name" value="'+esc(n.name)+'"></label>'+
   '<label>価格（円）<input type="number" inputmode="numeric" data-nid="'+n.id+'" data-f="price" value="'+esc(n.price)+'"></label>'+
   '<label class="wide">この機種で伝えること<textarea rows="2" data-nid="'+n.id+'" data-f="point">'+esc(n.point)+'</textarea></label></div></div>';
}
function edgeCard(e,i){
  var p=st.cur,opt=function(sel){return p.nodes.map(function(n){return '<option value="'+n.id+'"'+(n.id===sel?' selected':'')+'>'+esc(nlabel(n))+'</option>'}).join('')};
  return '<div class="item"><div class="ihead"><span class="chip" style="background:var(--ink);color:var(--bg)">'+(i+1)+'</span><span class="sp"></span>'+
   '<button class="btn sm" data-act="eup" data-id="'+e.id+'" aria-label="上へ">↑</button><button class="btn sm" data-act="edown" data-id="'+e.id+'" aria-label="下へ">↓</button><button class="btn sm" data-act="edel" data-id="'+e.id+'" aria-label="削除">削除</button></div>'+
   '<div class="form"><label>どの機種から<select data-eid="'+e.id+'" data-f="from">'+opt(e.from)+'</select></label>'+
   '<label>どの機種へ<select data-eid="'+e.id+'" data-f="to">'+opt(e.to)+'</select></label>'+
   '<label class="wide">きっかけ（矢印に出る一言）<input data-eid="'+e.id+'" data-f="label" value="'+esc(e.label)+'"></label>'+
   '<label class="wide">コンサルのしかた<textarea rows="3" data-eid="'+e.id+'" data-f="talk">'+esc(e.talk)+'</textarea></label></div></div>';
}
function renderEditor(){
  var p=st.cur,d=function(k,v){return 'data-k="'+k+'" value="'+esc(v)+'"'};
  $('#ed').innerHTML=
  '<section class="card"><h2>基本情報</h2><div class="form">'+
   '<label class="wide">タイトル<input '+d('title',p.title)+'></label>'+
   '<label>対象日<input '+d('period',p.period)+'></label><label>店舗<input '+d('store',p.store)+'></label>'+
   '<label class="wide">作成者<input '+d('author',p.author)+'></label>'+
   '<label class="wide">今週の狙い<textarea rows="2" data-k="aim">'+esc(p.aim)+'</textarea></label></div></section>'+
  '<section class="card"><h2>機種（STD / MID / FLAG）</h2><p class="hint">段は必要なものだけ使えます。MIDを使わず、STDからFLAGへ直接つなぐこともできます。</p>'+
   (p.nodes.length?p.nodes.map(nodeCard).join(''):'<p class="hint">まだ機種がありません。下のボタンで追加してください。</p>')+
   '<div class="row">'+TIERS.map(function(t){return '<button class="btn" data-act="nadd" data-t="'+t.id+'" style="background:'+t.color+';color:'+t.text+';border-color:'+t.color+'">＋ '+t.id+'を追加</button>'}).join('')+'</div></section>'+
  '<section class="card"><h2>コンサルの流れ</h2><p class="hint">矢印1本が、お客様の反応から次の機種へ進む1つの流れです。</p>'+
   (p.edges.length?p.edges.map(edgeCard).join(''):'<p class="hint">機種を2つ以上追加すると、流れをつなげます。</p>')+
   '<div class="row"><button class="btn" data-act="eadd"'+(p.nodes.length<2?' disabled':'')+'>＋ 流れを追加</button></div></section>'+
  '<section class="card"><h2>注意点・共有事項</h2><textarea rows="4" data-k="notes">'+esc(p.notes)+'</textarea></section>';
}
function refreshEdgeLabels(){
  [].forEach.call(document.querySelectorAll('select[data-f=from],select[data-f=to]'),function(s){
    [].forEach.call(s.options,function(o){var n=st.cur.nodes.filter(function(x){return x.id===o.value})[0];if(n)o.textContent=nlabel(n)});
  });
}

/* ---------- plans: storage ---------- */
function canSave(){return st.canWrite!==false}
function renderBar(){
  var sel=$('#plansel'),list=plans.slice().sort(function(a,b){return (b.updated||0)-(a.updated||0)});
  var inList=list.some(function(x){return x.id===st.cur.id});
  var o=(!inList?'<option value="'+st.cur.id+'" selected>'+esc(st.cur.title||'新しい作戦表')+'（未保存）</option>':'')+
    list.map(function(x){return '<option value="'+x.id+'"'+(x.id===st.cur.id?' selected':'')+'>'+esc(x.title||'無題')+(x.period?' / '+esc(x.period):'')+'</option>'}).join('');
  sel.innerHTML=o;
  $('#savebtn').disabled=!canSave();$('#delbtn').disabled=!canSave()||!inList;$('#pdfbtn').disabled=st.busy;
  var m={ok:['ok','店舗間で共有して保存します'],wait:['warn','共有データに接続中です'],fail:['warn','共有データに接続できません。保存はできない場合があります'],local:['warn','この端末にだけ保存します']}[st.status];
  $('#status').innerHTML='<span class="dot '+m[0]+'"></span>'+m[1]+(st.dirty?' / 未保存の変更があります':'')+
   (st.canWrite===false?' / 閲覧のみ（保存できません）':'')+(st.msg?' / '+esc(st.msg):'')+(st.err?' <span class="err">'+esc(st.err)+'</span>':'');
}
function loadPlan(p){st.cur=clone(p);st.dirty=false;st.msg='';st.err='';renderEditor();renderPreview();renderBar()}
function persistLocal(){try{localStorage.setItem(KEYL,JSON.stringify(local))}catch(e){}}
function savePlan(){
  if(!canSave())return;
  var p=clone(st.cur);p.updated=Date.now();st.cur.updated=p.updated;st.err='';
  if(db){
    db.doc('plans/'+p.id).set(p).then(function(){st.dirty=false;st.msg='保存しました';renderBar()}).catch(function(e){st.err='保存できませんでした（'+((e&&e.code)||'error')+'）';renderBar()});
  }else{
    local[p.id]=p;plans=Object.keys(local).map(function(k){return local[k]});persistLocal();st.dirty=false;st.msg='保存しました';renderBar();
  }
}
function deletePlan(){
  var id=st.cur.id;
  if(db){db.doc('plans/'+id).delete().then(function(){st.msg='削除しました'}).catch(function(e){st.err='削除できませんでした（'+((e&&e.code)||'error')+'）';renderBar()})}
  else{delete local[id];plans=Object.keys(local).map(function(k){return local[k]});persistLocal();st.msg='削除しました'}
  var rest=plans.filter(function(x){return x.id!==id});
  if(rest.length)loadPlan(rest.sort(function(a,b){return (b.updated||0)-(a.updated||0)})[0]);else loadPlan(blankPlan());
}

/* ---------- PDF ---------- */
async function exportPdf(){
  if(st.busy)return;
  if(!window.html2canvas||!window.jspdf){st.err='PDFの部品を読み込めていません。再読み込みしてください。';renderBar();return}
  st.busy=true;st.err='';st.msg='PDFを作成中…';renderBar();
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    var pages=pagesHtml(st.cur),holder=$('#holder');
    var doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'pt',format:'a4'});
    var PW=doc.internal.pageSize.getWidth(),PH=doc.internal.pageSize.getHeight();
    for(var i=0;i<pages.length;i++){
      holder.innerHTML=pages[i];
      var cv=await window.html2canvas(holder.firstElementChild,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:1200});
      if(i>0)doc.addPage();
      var r=Math.min(PW/cv.width,PH/cv.height),w=cv.width*r,h=cv.height*r;
      doc.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',(PW-w)/2,0,w,h);
    }
    holder.innerHTML='';
    var name=((st.cur.title||'作戦表')+(st.cur.period?'_'+st.cur.period:'')).replace(/[\\\/:*?"<>|\s]+/g,'_')+'.pdf';
    var blob=doc.output('blob');
    if(dlcap){await dlcap.save({filename:name,data:blob})}
    else{var an=document.createElement('a');an.href=URL.createObjectURL(blob);an.download=name;document.body.appendChild(an);an.click();an.remove();setTimeout(function(){URL.revokeObjectURL(an.href)},5000)}
    st.msg='PDFを保存しました';
  }catch(e){
    $('#holder').innerHTML='';
    st.msg='';
    st.err=(e&&e.code==='declined')?'PDFの保存を取りやめました。':'PDFを作れませんでした。'+(e&&e.message?'（'+e.message+'）':'');
  }
  st.busy=false;renderBar();
}

/* ---------- events ---------- */
function moveIn(arr,id,dir,same){
  var i=arr.findIndex(function(x){return x.id===id});if(i<0)return;
  var j=i+dir;while(j>=0&&j<arr.length&&same&&arr[j].tier!==arr[i].tier)j+=dir;
  if(j<0||j>=arr.length)return;var t=arr[i];arr[i]=arr[j];arr[j]=t;
}
function changed(){st.dirty=true;st.touched=true;st.msg='';renderBar();schedulePreview()}
document.addEventListener('input',function(e){
  var t=e.target,p=st.cur;if(!t.dataset)return;
  if(t.dataset.k){p[t.dataset.k]=t.value;changed();return}
  if(t.dataset.nid){
    var n=p.nodes.filter(function(x){return x.id===t.dataset.nid})[0];if(!n)return;
    var f=t.dataset.f;n[f]=f==='price'?(t.value===''?'':Number(t.value)):t.value;
    changed();
    if(f==='tier'){renderEditor()}else if(f==='model'||f==='name'){refreshEdgeLabels()}
    return;
  }
  if(t.dataset.eid){
    var g=p.edges.filter(function(x){return x.id===t.dataset.eid})[0];if(!g)return;
    g[t.dataset.f]=t.value;changed();
  }
});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var a=b.dataset.act,p=st.cur,id=b.dataset.id;
  if(a==='pane'){
    st.pane=b.dataset.p;$('#panes').dataset.pane=st.pane;
    [].forEach.call(document.querySelectorAll('.tabs .btn'),function(x){x.setAttribute('aria-selected',x.dataset.p===st.pane)});
    if(st.pane==='view')setTimeout(fit,0);return;
  }
  if(a==='newplan'){loadPlan(blankPlan());return}
  if(a==='sample'){loadPlan(samplePlan());return}
  if(a==='save'){savePlan();return}
  if(a==='del'){deletePlan();return}
  if(a==='pdf'){exportPdf();return}
  if(a==='nadd'){p.nodes.push({id:uid('n'),tier:b.dataset.t,maker:'',model:'',name:'',price:'',point:''})}
  else if(a==='ndel'){p.nodes=p.nodes.filter(function(x){return x.id!==id});p.edges=p.edges.filter(function(x){return x.from!==id&&x.to!==id})}
  else if(a==='nup'){moveIn(p.nodes,id,-1,true)}
  else if(a==='ndown'){moveIn(p.nodes,id,1,true)}
  else if(a==='eadd'){p.edges.push({id:uid('e'),from:p.nodes[0].id,to:p.nodes[Math.min(1,p.nodes.length-1)].id,label:'',talk:''})}
  else if(a==='edel'){p.edges=p.edges.filter(function(x){return x.id!==id})}
  else if(a==='eup'){moveIn(p.edges,id,-1,false)}
  else if(a==='edown'){moveIn(p.edges,id,1,false)}
  else return;
  changed();renderEditor();
});
$('#plansel').addEventListener('change',function(e){
  var x=plans.filter(function(q){return q.id===e.target.value})[0];
  if(x)loadPlan(x);
});

/* ---------- start ---------- */
st.cur=samplePlan();
renderEditor();renderPreview();renderBar();

(async function init(){
  var loaded=false;
  try{if(window.claude&&window.claude.use){dlcap=await window.claude.use('downloads');db=await window.claude.use('db')}}catch(e){}
  if(!db){
    try{local=JSON.parse(localStorage.getItem(KEYL)||'{}')}catch(e){local={}}
    plans=Object.keys(local).map(function(k){return local[k]});
    st.status='local';
    if(plans.length)loadPlan(plans.slice().sort(function(a,b){return (b.updated||0)-(a.updated||0)})[0]);else renderBar();
    return;
  }
  st.status='wait';renderBar();
  try{var user=await window.claude.use('user');if(user&&user.can){var c=await Promise.resolve(user.can('data.write'));if(c===false){st.canWrite=false;renderBar()}}}catch(e){}
  var timer=setTimeout(function(){if(!loaded){st.status='fail';renderBar()}},10000);
  db.collection('plans').onSnapshot(function(snap){
    loaded=true;clearTimeout(timer);st.status='ok';
    plans=snap.docs.map(function(d){return d.data()});
    var first=!st.firstDone;st.firstDone=true;
    if(first&&!st.touched&&plans.length){loadPlan(plans.slice().sort(function(a,b){return (b.updated||0)-(a.updated||0)})[0])}
    else renderBar();
  },function(){loaded=true;clearTimeout(timer);st.status='fail';renderBar()});
})();
</script>
