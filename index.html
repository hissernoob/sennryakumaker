<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>戦略メーカー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* layout: toolbar on top; author pane and A4 preview pane side by side (tabs on phones); paper stays white for print */
:root{
  --bg:#EEF1F5;--surface:#FFFFFF;--ink:#111827;--muted:#5A6577;--line:#D6DBE3;
  --accent:#C8102E;--accent-ink:#FFFFFF;--desk:#D9DEE6;
  --f:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1217;--surface:#171C24;--ink:#EDF0F5;--muted:#9BA6B5;--line:#2A323E;
  --accent:#FF6477;--accent-ink:#2A0309;--desk:#0A0D11;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1217;--surface:#171C24;--ink:#EDF0F5;--muted:#9BA6B5;--line:#2A323E;
  --accent:#FF6477;--accent-ink:#2A0309;--desk:#0A0D11;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.6;
  padding-block:12px 40px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
h1{font-size:19px;line-height:1.3;margin:0;font-weight:700}
h2{font-size:15px;margin:0;font-weight:700}
.top{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.bar .sp{flex:1}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical}
select:focus-visible,input:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.btn{font:inherit;font-weight:500;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.dpick{margin-top:6px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.btn.dp{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;font-size:13px;font-weight:700;border:2px solid var(--dc,var(--line));background:var(--dt,var(--surface));color:var(--dc,var(--ink))}
.btn.dp.none{--dc:var(--line)}
.btn.dp[aria-pressed="true"]{background:var(--dc,var(--ink));color:#fff;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--dc,var(--ink))}
.btn.dp.none[aria-pressed="true"]{background:var(--ink);color:var(--bg);--dc:var(--ink)}
@media (max-width:520px){.dpick{grid-template-columns:repeat(3,1fr)}}
.tnbox{border:1px dashed var(--line);border-radius:8px;padding:6px 10px;margin:6px 0}
.tnbox summary{cursor:pointer;font-size:13px;font-weight:600}
.tnrow{display:grid;grid-template-columns:auto 1fr 1.4fr auto;gap:8px;align-items:end;margin:6px 0}
.tnrow input[type=color]{width:40px;height:36px}
.tnb{display:flex;gap:6px;align-items:flex-end}
.tnb .ord select{padding:6px 8px}
@media (max-width:520px){.tnrow{grid-template-columns:auto 1fr}.tnrow label:nth-of-type(2),.tnb{grid-column:1/-1}}
.shov{position:fixed;inset:0;background:rgba(10,15,25,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.shov[hidden]{display:none}
.shbox{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:14px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.shbox h2{margin:0 0 6px;font-size:18px}.shbox p{margin:6px 0;font-size:13px;line-height:1.7}
.shbox .warn{border-left:4px solid var(--accent);background:var(--surface);padding:6px 10px;border-radius:4px;font-size:12.5px;line-height:1.7;margin:8px 0}
.shbox .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.shbox textarea{font-size:12px;word-break:break-all;height:90px}
.shbox .shpv{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px}
.status{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:99px;background:var(--muted);display:inline-block}
.dot.ok{background:#2E9E5B}.dot.warn{background:#D99A1B}
.err{color:var(--accent)}
.tabs{display:none;gap:4px}
.tabs .btn[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panes{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
.panes[data-pane="edit"] .pv{display:none}
.panes[data-pane="view"] .ed{display:none}
@media (max-width:999px){.tabs{display:flex}}
@media (min-width:1000px){
  .panes{grid-template-columns:minmax(380px,460px) minmax(0,1fr)}
  .panes[data-pane] .pv,.panes[data-pane] .ed{display:flex}
  .pv{position:sticky;top:8px}
}
.ed{display:flex;flex-direction:column;gap:10px;min-width:0}
.pv{flex-direction:column;gap:8px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.form .wide{grid-column:1/-1}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.ihead{display:flex;gap:6px;align-items:center}
.ihead .sp{flex:1}
.chip{font-size:12px;font-weight:700;border-radius:5px;padding:1px 9px}
.hint{margin:0;font-size:12px;color:var(--muted)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pvbox{background:var(--desk);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 110px);overflow-y:auto}
.pgl{font-size:12px;color:var(--muted);margin:0 0 4px}
.pgwrap{position:relative;overflow:hidden;box-shadow:0 1px 8px rgba(0,0,0,.25);background:#fff}
.pgwrap>.paper{position:absolute;left:0;top:0;transform-origin:0 0}
@media (max-width:999px){.pvbox{max-height:none}}
#holder{position:fixed;left:0;top:0;z-index:-1;pointer-events:none;width:1123px}

/* editor extras */
.phrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pcol{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.thumb{width:88px;height:62px;border:1px solid var(--line);border-radius:6px;background:var(--surface) center/contain no-repeat;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.fb{position:relative;cursor:pointer;display:inline-flex;flex-direction:row;align-items:center;color:var(--ink)}
.fb input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.fb:focus-within{outline:2px solid var(--accent);outline-offset:2px}

.trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.trow .tl{min-width:10em;font-size:12px;color:var(--muted)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg .btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.swatches{display:flex;flex-wrap:wrap;gap:12px}
.swatches label{align-items:flex-start}
input[type=color]{width:48px;height:34px;padding:2px;cursor:pointer}
summary h2{display:inline}
/* paper: fixed light colors so print output never changes with the viewer theme */
.paper{width:1123px;min-height:794px;background:#fff;color:#1B2230;padding:28px 32px;font-family:var(--f);line-height:1.5;display:flex;flex-direction:column;gap:14px}
.paper *{box-sizing:border-box}
.paper{position:relative;z-index:0;overflow:hidden}
.paper.hasd{background:var(--dt);box-shadow:inset 14px 0 0 var(--dc);padding-left:42px}
.dband{margin:-28px -32px 0 -42px;padding:12px 32px 12px 42px;background:var(--dc);color:var(--don,#fff);display:flex;align-items:center;gap:14px;border-bottom:5px solid var(--dd);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.10) 0 14px,rgba(255,255,255,0) 14px 28px)}
.dbi{display:flex;width:50px;height:50px;border-radius:12px;background:rgba(255,255,255,.18);align-items:center;justify-content:center;flex:none;text-shadow:none}
.dbn{font-size:34px;font-weight:700;letter-spacing:.06em;line-height:1.1}
.dbn small{font-size:15px;font-weight:500;margin-left:8px;letter-spacing:.1em}
.dbs{margin-left:auto;font-size:15px;font-weight:700;letter-spacing:.12em;border:2px solid currentColor;border-radius:99px;padding:3px 16px}
.wm{position:absolute;right:-40px;bottom:-50px;z-index:-1;color:var(--dc);opacity:.09;pointer-events:none}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.pk{font-size:12px;color:#5A6577;letter-spacing:.08em}
.pt{font-size:calc(40px*var(--f-head,1));font-weight:700;line-height:1.3;margin:0;color:#1B2230}
.pm{display:flex;gap:8px}
.pm div{border:1px solid #CBD2DC;border-radius:6px;padding:4px 12px;min-width:110px}
.pm small{display:block;font-size:10px;color:#5A6577}
.pm span{font-size:14px;font-weight:700}
.aim{background:#F3F5F8;border-left:5px solid var(--dd,#1B2230);padding:10px 16px;font-weight:700;line-height:1.4;font-size:calc(22px*var(--f-head,1));white-space:pre-wrap;overflow-wrap:anywhere}
.foot2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.foot2.one{grid-template-columns:1fr}
.fb2{border:1.5px solid var(--dd,#1B2230);border-radius:8px;overflow:hidden;background:#fff}
.fb2 h3{margin:0;padding:5px 12px;background:var(--dd,#1B2230);color:#fff;font-size:calc(13px*var(--f-point,1));letter-spacing:.04em}
.fb2 ul{margin:0;padding:8px 12px 8px 28px;font-size:calc(13px*var(--f-point,1));line-height:1.55;color:#1B2230}.fb2 li{overflow-wrap:anywhere}.fb2 li+li{margin-top:2px}
.aim small{font-size:13px;font-weight:700;margin-bottom:2px;color:#5A6577;display:block}
.flow{position:relative;width:1059px}
.ln{position:absolute;top:0;border-radius:10px}
.lh{position:absolute;top:0;height:30px;border-radius:10px 10px 0 0;font-weight:700;font-size:14px;padding:3px 12px;display:flex;align-items:center;gap:10px}
.eb{position:absolute;width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-sizing:border-box;font-size:12px;font-weight:800;line-height:18px;text-align:center;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.tblk{position:absolute;border:2px solid;border-radius:10px}.tstrip{position:absolute;height:24px;border-radius:8px 8px 0 0;font-size:13px;font-weight:700;padding:0 10px;line-height:24px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.tstrip small{font-weight:500;margin-left:6px;opacity:.9}
.lh{white-space:nowrap;overflow:hidden}.lh small{font-weight:500;font-size:12px;overflow:hidden;text-overflow:ellipsis}
.flow svg{position:absolute;left:0;top:0}
.nd{position:absolute;border:2px solid;border-radius:10px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.nh{display:flex;align-items:baseline;gap:8px;padding:4px 12px;font-weight:700;font-size:16px;line-height:22px}
.nh small{font-size:12px;font-weight:500;opacity:.92}
.nbd{padding:12px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.nt1{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.nt1 .tx{min-width:0;flex:1}
.mk{font-size:calc(14px*var(--f-maker,1));color:#3C4757;font-weight:500;line-height:1.45;overflow-wrap:anywhere}
.md{font-family:var(--mono);font-weight:700;line-height:1.25;overflow-wrap:anywhere;color:#111827}
.pr{font-size:calc(20px*var(--f-price,1));font-weight:700;font-family:var(--mono);line-height:1.4;color:var(--pc,#B0102A)}
.pr small{font-size:11px;font-weight:500;color:#5A6577;margin-left:4px;font-family:var(--f)}
.ft{font-size:calc(14px*var(--f-feat,1));line-height:1.45;color:#2A3646;overflow-wrap:anywhere}
.pt2{font-size:calc(13px*var(--f-point,1));line-height:1.5;background:#F3F5F8;border-radius:6px;padding:6px 10px;overflow-wrap:anywhere;white-space:pre-wrap}
.pt2 small{display:block;font-size:11px;color:#5A6577;font-weight:700}
.pho{flex:none;width:var(--pw,88px);height:var(--ph,62px);border:1px solid #D6DBE3;border-radius:6px;background:#F3F5F8 center/contain no-repeat}
.pill{position:absolute;display:flex;align-items:center;gap:6px;box-sizing:border-box;border:1px solid;border-radius:5px;background:rgba(255,255,255,.94);padding:0 6px 0 3px;white-space:normal;font-size:calc(13px*var(--f-label,1));line-height:calc(17px*var(--f-label,1));font-weight:700;color:#1B2230;overflow-wrap:anywhere;word-break:break-all}
.pill.inl{white-space:nowrap;word-break:keep-all;overflow-wrap:normal}.pill i{font-style:normal;width:var(--pb,28px);height:var(--pb,28px);border-radius:99px;color:#fff;font-size:calc(var(--pb,28px)*.58);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;text-shadow:none}
.empty{position:absolute;left:0;right:0;top:40px;text-align:center;color:#5A6577;font-size:15px}
.pf{font-size:11px;color:#5A6577;margin-top:auto}
.h2p{font-size:18px;font-weight:700;margin:0;border-bottom:2px solid var(--dd,#1B2230);padding-bottom:4px}
.lst{display:flex;gap:24px;align-items:flex-start}
.lc{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0}
.rw{display:flex;gap:10px;align-items:flex-start;border:1px solid #D6DBE3;border-radius:10px;padding:10px 12px}
.no{flex:none;width:var(--cn,36px);height:var(--cn,36px);border-radius:99px;font-weight:700;font-size:calc(var(--cn,36px)*.56);display:flex;align-items:center;justify-content:center}
.rb{min-width:0;flex:1;display:flex;flex-direction:column;gap:8px}
.tg{font-size:11px;font-weight:700;border-radius:4px;padding:0 7px;line-height:18px}
.rh{font-size:15px;font-weight:700;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.rh .lb{background:#F3F5F8;border:1px solid #CBD2DC;border-radius:5px;padding:0 8px;font-weight:500;font-size:13px}
.sk{font-size:11px;font-weight:700;border:1px dashed #5A6577;border-radius:5px;padding:0 6px;color:#5A6577}
.hq{background:#FFF6D9;border-left:4px solid #E0A100;border-radius:4px;padding:6px 10px}
.hl{font-size:12px;font-weight:700;color:#5A6577;margin-bottom:2px}
.hq .hl{color:#6B4A00}
.hrow{display:flex;gap:6px;font-size:calc(14px*var(--f-hear,1));line-height:1.5}
.hrow i{font-style:normal;font-weight:700;color:#8A5E00;flex:none}
.tk{font-size:calc(13px*var(--f-talk,1));line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.band{display:grid;grid-template-columns:1fr 1fr;gap:12px}.band.one{grid-template-columns:1fr}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.tc{border:1px solid #D6DBE3;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;min-width:0}
.tch{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:calc(14px*var(--f-label,1));font-weight:700}
.nt{border:1px solid #CBD2DC;border-radius:8px;padding:10px 14px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
</style>

</head>
<body>
<div class="top">
  <div class="bar">
    <h1>戦略メーカー <button type="button" data-act="ver" id="verbtn" title="更新履歴を見る" style="font:inherit;font-size:12px;font-weight:600;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:1px 8px;vertical-align:middle;cursor:pointer">Ver.2.4</button></h1>
    <span class="sp"></span>
    <button class="btn" data-act="newplan">新規</button>
    <button class="btn" data-act="sample">サンプル</button>
    <select id="plansel" aria-label="保存した作戦表"></select>
    <button class="btn" data-act="save" id="savebtn">保存</button>
    <button class="btn" data-act="del" id="delbtn">削除</button>
    <button class="btn" data-act="share" id="sharebtn" hidden>共有リンク</button>
    <button class="btn" data-act="img" id="imgbtn">画像を出力</button>
    <button class="btn pri" data-act="pdf" id="pdfbtn">PDFを出力</button>
  </div>
  <div class="status" id="status"></div>
  <div class="tabs"><button class="btn" data-act="pane" data-p="edit" aria-selected="true">作成</button><button class="btn" data-act="pane" data-p="view" aria-selected="false">プレビュー</button></div>
  <div class="panes" id="panes" data-pane="edit">
    <div class="ed" id="ed"></div>
    <div class="pv" id="pv"><div class="pvbox" id="pvbox"></div></div>
  </div>
</div>
<div id="holder"></div>
<div class="shov" id="shov" hidden role="dialog" aria-modal="true" aria-labelledby="shtitle"><div class="shbox" id="shbox"></div></div>
<datalist id="makers"><option value="シャープ"><option value="ソニー"><option value="パナソニック"><option value="REGZA"><option value="LG"><option value="ハイセンス"></datalist>

<script>
var TIERS=[
 {id:'STD',sub:'アテンション・入口',color:'#E0A100',text:'#3B2A00',tint:'#FFF6D9'},
 {id:'MID',sub:'ステップアップ',color:'#2F6FDB',text:'#FFFFFF',tint:'#E8F0FD'},
 {id:'FLAG',sub:'ゴール・着地',color:'#D62839',text:'#FFFFFF',tint:'#FDE9EC'}
];
var KEYL='tv43plans-v3';
var db=null,dlcap=null,plans=[],local={};
var st={cur:null,pane:'edit',dirty:false,status:'local',canWrite:null,msg:'',err:'',busy:false,touched:false,saved:false};

function $(s){return document.querySelector(s)}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function uid(p){return p+Math.random().toString(36).slice(2,8)}
var PAL=['#0E9F6E','#8B5CF6','#EA580C','#0891B2','#DB2777','#65A30D'],MAXT=6;
function tierList(p){p=p||st.cur;
  var raw=(Array.isArray(p.tiers)&&p.tiers.length)?p.tiers:TIERS.map(function(b){var t=(p.tn||{})[b.id]||{};return {id:b.id,n:(typeof t.n==='string'&&t.n.trim())?t.n.trim().slice(0,10):b.id,s:typeof t.s==='string'?t.s.slice(0,20):b.sub}});
  return raw.map(function(t,i){return Object.assign({},t,{o:(typeof t.o==='number'&&t.o>=1)?Math.round(t.o):i+1,_i:i})}).sort(function(x,y){return x.o-y.o||x._i-y._i})}
function ensureTiers(p){if(!Array.isArray(p.tiers)||!p.tiers.length){p.tiers=tierList(p).map(function(t){var c=Object.assign({},t);delete c._i;return c});delete p.tn}else p.tiers.forEach(function(t,i){if(typeof t.o!=='number')t.o=i+1});return p.tiers}
function ranksOf(p){var r=[];tierList(p).forEach(function(t){if(r.indexOf(t.o)<0)r.push(t.o)});return r.sort(function(a,b){return a-b})}
function tierO(id,p){var L=tierList(p),b=L.filter(function(t){return t.id===id})[0]||L[0];return b.o}
function stepOf(a,b,p){var R=ranksOf(p);return R.length>1&&tierO(a,p)===R[0]&&tierO(b,p)===R[1]}
/* 同じ「順番」の段は同じ列にまとまり、機種は上から順に並ぶ */
function colsOf(p){p=p||st.cur;var cols=[];

function layout(p){
  var cols=colsOf(p),n=cols.length||1,pad=14,inner=1059-2*pad;
  var nodeW=n===1?420:n===2?330:n===3?236:Math.max(84,Math.floor((inner-(n-1)*(n===4?110:n===5?100:90))/n)),G=n>1?(inner-n*nodeW)/(n-1):0,TOP=56,GAP=40,SY=24,map={},strips=[],blocks=[],bottom=TOP;
  cols.forEach(function(c,ci){
    var x=n===1?(1059-nodeW)/2:pad+ci*(nodeW+G),y=TOP;
    c.tiers.forEach(function(t){
      var grp=p.nodes.filter(function(q){return q.tier===t.id});if(!grp.length)return;
      var y0=y;
      if(c.tiers.length>1){strips.push({x:x-8,y:y,w:nodeW+16,h:SY,t:t});y+=SY+8}
      grp.forEach(function(nd){var h=measureNode(nd,nodeW);map[nd.id]={nd:nd,ci:ci,x:x,y:y,w:nodeW,h:h};y+=h+GAP});
      if(c.tiers.length>1){y=y-GAP+10;blocks.push({x:x-8,y:y0,w:nodeW+16,h:y-y0,t:t});y+=GAP-6}});
    bottom=Math.max(bottom,y-GAP);
  });
  return {cols:cols,n:n,nodeW:nodeW,G:G,map:map,strips:strips,blocks:blocks,flowH:bottom+40};
}

/* ---- 矢印の経路: 段の間の通路を縦に、機種の外側の通路を横に通す直角ルート。カードの裏には回りません ---- */
function dedupePts(pts){var o=[];pts.forEach(function(q){var l=o[o.length-1];if(!l||Math.abs(l[0]-q[0])>.01||Math.abs(l[1]-q[1])>.01)o.push(q)});
  var r=[];o.forEach(function(q,i){var a=r[r.length-2],b=r[r.length-1];if(a&&b&&((Math.abs(a[0]-b[0])<.01&&Math.abs(b[0]-q[0])<.01)||(Math.abs(a[1]-b[1])<.01&&Math.abs(b[1]-q[1])<.01)))r[r.length-1]=q;else r.push(q)});return r}
function roundPath(pts,r){var d='M'+pts[0][0]+' '+pts[0][1];
  for(var i=1;i<pts.length-1;i++){var a=pts[i-1],b=pts[i],c=pts[i+1],l1=Math.hypot(b[0]-a[0],b[1]-a[1]),l2=Math.hypot(c[0]-b[0],c[1]-b[1]),rr=Math.min(r,l1/2,l2/2);
    d+=' L'+(b[0]+(a[0]-b[0])/l1*rr)+' '+(b[1]+(a[1]-b[1])/l1*rr)+' Q'+b[0]+' '+b[1]+' '+(b[0]+(c[0]-b[0])/l2*rr)+' '+(b[1]+(c[1]-b[1])/l2*rr)}
  var e=pts[pts.length-1];return d+' L'+e[0]+' '+e[1]}
/* ====================================================================
   自動レイアウト（矢印の経路探索）
   1) 機種の出入口（ポート）を行き先の高さ順に割り当てる
   2) 6px格子の上で A* 探索し、機種を避けて直角に進む
      ・他の矢印とは 12px 以上離す（平行して重ならない）
      ・どうしても交わるときは「十字に横切る」だけ（高いコスト）
      ・曲がりは少なく、近い矢印から先に引く
   3) 出発・到着の手前は必ずまっすぐ（番号バッジと矢じりの置き場）
   ==================================================================== */
var RT={P:6,SA:18,SB:36,BEND:10,CROSS:30};
function MinHeap(){this.a=[]}
MinHeap.prototype.push=function(k,v){var a=this.a,i=a.length;a.push([k,v]);while(i>0){var p=(i-1)>>1;if(a[p][0]<=a[i][0])break;var t=a[p];a[p]=a[i];a[i]=t;i=p}};
MinHeap.prototype.pop=function(){var a=this.a,top=a[0],last=a.pop();if(a.length){a[0]=last;var i=0,n=a.length;for(;;){var l=2*i+1,r=l+1,m=i;if(l<n&&a[l][0]<a[m][0])m=l;if(r<n&&a[r][0]<a[m][0])m=r;if(m===i)break;var t=a[m];a[m]=a[i];a[i]=t;i=m}}return top};
MinHeap.prototype.size=function(){return this.a.length};
function edgeGeoms(p,L){
  var P=RT.P,W=1059,H=Math.ceil(L.flowH),NC=Math.ceil(W/P)+1,NR=Math.ceil(H/P)+1,list=[],n=L.n;
  p.edges.forEach(function(e,i){
    var a=L.map[e.from],b=L.map[e.to];if(!a||!b||a===b)return;
    var d=b.ci-a.ci;list.push({e:e,i:i,a:a,b:b,dir:d>0?1:(d<0?-1:0),skip:Math.abs(d)>1});
  });
  /* --- 1) ポート --- */
  list.forEach(function(g){
    if(g.dir===0){g.sa=g.sb=(n===1||g.a.ci<n-1)?'R':'L'}else{g.sa=g.dir>0?'R':'L';g.sb=g.dir>0?'L':'R'}
  });
  var ports={};
  function reg(g,w){var nd=w==='a'?g.a:g.b,side=w==='a'?g.sa:g.sb,oth=w==='a'?g.b:g.a;(ports[nd.nd.id+side]=ports[nd.nd.id+side]||[]).push({g:g,w:w,oy:oth.y+oth.h/2+g.i*.001,nd:nd})}
  list.forEach(function(g){reg(g,'a');reg(g,'b')});
  Object.keys(ports).forEach(function(k){
    var arr=ports[k].sort(function(x,y){return x.oy-y.oy}),c=arr.length,h=arr[0].nd.h,sp=Math.min(24,Math.max(18,Math.floor((h-40)/Math.max(1,c-1)/P)*P));
    arr.forEach(function(q,i){q.g['y'+q.w]=Math.round((q.nd.y+h/2+(i-(c-1)/2)*(c>1?sp:0))/P)*P})});
  list.forEach(function(g){g.x1=g.sa==='R'?g.a.x+g.a.w:g.a.x;g.x2=g.sb==='R'?g.b.x+g.b.w:g.b.x;
    g.dxa=g.sa==='R'?1:-1;g.dxb=g.sb==='R'?1:-1;
    g.cs=[Math.round((g.x1+g.dxa*RT.SA)/P),Math.round(g.ya/P)];g.ce=[Math.round((g.x2+g.dxb*RT.SB)/P),Math.round(g.yb/P)]});
  /* --- 格子 --- */
  var N=NC*NR,obs=new Uint8Array(N),bH=new Int16Array(N),bV=new Int16Array(N),uH=new Int16Array(N),uV=new Int16Array(N);
  function ix(cx,cy){return cy*NC+cx}
  function rectBlock(x,y,w,h,m){var x0=Math.floor((x-m)/P),x1=Math.ceil((x+w+m)/P),y0=Math.floor((y-m)/P),y1=Math.ceil((y+h+m)/P);
    for(var cy=Math.max(0,y0);cy<=Math.min(NR-1,y1);cy++)for(var cx=Math.max(0,x0);cx<=Math.min(NC-1,x1);cx++)obs[ix(cx,cy)]=1}
  Object.keys(L.map).forEach(function(k){var o=L.map[k];rectBlock(o.x,o.y,o.w,o.h,7)});
  L.strips.forEach(function(q){rectBlock(q.x,q.y,q.w,q.h,5)});
  for(var cx=0;cx<NC;cx++){for(var cy=0;cy<NR;cy++){if(cx<1||cx>NC-2||cy*P<40||cy>NR-2)obs[ix(cx,cy)]=1}}
  function mark(arr,cx,cy,id){if(cx<0||cy<0||cx>=NC||cy>=NR)return;var k=ix(cx,cy);if(!arr[k])arr[k]=id}
  function markH(cx,cy,id){for(var d=-2;d<=2;d++)mark(bH,cx,cy+d,id);uH[ix(cx,cy)]=id}
  function markV(cx,cy,id){for(var d=-2;d<=2;d++)mark(bV,cx+d,cy,id);uV[ix(cx,cy)]=id}
  /* 出発・到着の手前（まっすぐ部分）は先に確保し、他の矢印を寄せつけない */
  function reserve(g,pt,x0,dx,y,id){var c0=Math.round(x0/P),c1=pt[0],lo=Math.min(c0,c1),hi=Math.max(c0,c1);
    for(var ex=1;ex<=3;ex++){var xx=c1+(c1>=c0?ex:-ex);for(var dd=-2;dd<=2;dd++)mark(bH,xx,pt[1]+dd,id)}
    for(var cx=lo;cx<=hi;cx++){markH(cx,pt[1],id);for(var dy=-2;dy<=2;dy++)for(var ddx=-2;ddx<=2;ddx++)mark(bV,cx+ddx,pt[1]+dy,id)}}
  list.forEach(function(g,k){g.id=k+1;reserve(g,g.cs,g.x1,g.dxa,g.ya,g.id);reserve(g,g.ce,g.x2,g.dxb,g.yb,g.id)});
  /* --- 2) A* --- */
  var DX=[1,-1,0,0],DY=[0,0,1,-1];
  function route(g,relax){
    var id=g.id,S=g.cs,T=g.ce,size=N*4,dist=new Float32Array(size).fill(1e9),prev=new Int32Array(size).fill(-1),hp=new MinHeap();
    var d0=g.dxa>0?0:1,s0=ix(S[0],S[1])*4+d0;dist[s0]=0;hp.push(Math.abs(S[0]-T[0])+Math.abs(S[1]-T[1]),s0);
    var goal=-1;
    while(hp.size()){
      var cur=hp.pop(),st=cur[1],c=st>>2,d=st&3,gd=dist[st];
      if(cur[0]-(Math.abs((c%NC)-T[0])+Math.abs(((c/NC)|0)-T[1]))>gd+.01)continue;
      var cx=c%NC,cy=(c/NC)|0;
      if(cx===T[0]&&cy===T[1]){goal=st;break}
      for(var nd=0;nd<4;nd++){
        if((nd^1)===d&&(nd>>1)===(d>>1))continue;
        var nx=cx+DX[nd],ny=cy+DY[nd];if(nx<0||ny<0||nx>=NC||ny>=NR)continue;
        var nc=ix(nx,ny);if(obs[nc])continue;
        var horiz=nd<2,cost=1;
        if(!relax){
          var bb=horiz?bH[nc]:bV[nc];if(bb&&bb!==id)continue;
          if(nd!==d){if((bH[c]&&bH[c]!==id)||(bV[c]&&bV[c]!==id))continue;cost+=RT.BEND}
          var cr=horiz?uV[nc]:uH[nc];if(cr&&cr!==id)cost+=RT.CROSS;
        }else{
          if(nd!==d)cost+=RT.BEND;
          var cr2=horiz?(uH[nc]&&uH[nc]!==id?200:(uV[nc]&&uV[nc]!==id?RT.CROSS:0)):(uV[nc]&&uV[nc]!==id?200:(uH[nc]&&uH[nc]!==id?RT.CROSS:0));cost+=cr2;

  img.onload=function(){
    var m=360,sc=Math.min(1,m/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*sc)),h=Math.max(1,Math.round(img.height*sc));
    var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
    var n=st.cur.nodes.filter(function(q){return q.id===id})[0];
    if(n){n.photo=c.toDataURL('image/jpeg',0.72);st.err='';changed();renderEditor()}
    URL.revokeObjectURL(url);
  };
  img.onerror=function(){URL.revokeObjectURL(url);st.err='写真を読み込めませんでした。JPEGかPNGを選んでください。';renderBar()};
  img.src=url;
}
document.addEventListener('toggle',function(e){if(e.target&&e.target.id==='adv')st.adv=e.target.open;if(e.target&&e.target.id==='tnb')st.tnOpen=e.target.open},true);
document.addEventListener('focusout',function(e){var t=e.target;if(t&&t.dataset&&t.dataset.tn&&!(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('.tnbox')))renderEditor()});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t&&t.dataset&&t.dataset.tord){var T=ensureTiers(st.cur),q=T.filter(function(x){return x.id===t.dataset.tord})[0];if(q){q.o=Math.max(1,Math.min(MAXT,+t.value||1));changed();renderEditor()}return}
  if(t&&t.dataset&&(t.dataset.dzc||t.dataset.dzp||t.dataset.tcol)){renderEditor();return}
  if(t&&t.dataset&&t.dataset.photo){var f=t.files&&t.files[0];if(f)attachPhoto(t.dataset.photo,f);t.value=''}
});
$('#plansel').addEventListener('change',function(e){
  var x=plans.filter(function(q){return q.id===e.target.value})[0];
  if(x)loadPlan(x);
});

/* ---------- start ---------- */
st.cur=samplePlan();
renderEditor();renderPreview();renderBar();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){schedulePreview()});

(async function init(){
  var loaded=false;
  try{if(window.claude&&window.claude.use){dlcap=await window.claude.use('downloads');db=await window.claude.use('db')}}catch(e){}
  if(!db){
    try{local=JSON.parse(localStorage.getItem(KEYL)||'{}')}catch(e){local={}}
    plans=Object.keys(local).map(function(k){return local[k]});
    st.status='local';
    if(plans.length)loadPlan(plans.slice().sort(function(a,b){return (b.updated||0)-(a.updated||0)})[0]);else renderBar();
    if(STANDALONE)handleShareHash();
    return;
  }
  st.status='wait';renderBar();
  try{var user=await window.claude.use('user');if(user&&user.can){var c=await Promise.resolve(user.can('data.write'));if(c===false){st.canWrite=false;renderBar()}}}catch(e){}
  var timer=setTimeout(function(){if(!loaded){st.status='fail';renderBar()}},10000);
  db.collection('plans').onSnapshot(function(snap){
    loaded=true;clearTimeout(timer);st.status='ok';
    plans=snap.docs.map(function(d){return d.data()});
    var first=!st.firstDone;st.firstDone=true;
    if(first&&!st.touched&&plans.length){loadPlan(plans.slice().sort(function(a,b){return (b.updated||0)-(a.updated||0)})[0])}
    else renderBar();
  },function(){loaded=true;clearTimeout(timer);st.status='fail';renderBar()});
})();
</script>
