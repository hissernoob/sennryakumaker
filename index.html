<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>戦略メーカー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* layout: toolbar on top; author pane and A4 preview pane side by side (tabs on phones); paper stays white for print */
:root{
  --bg:#EEF1F5;--surface:#FFFFFF;--ink:#111827;--muted:#5A6577;--line:#D6DBE3;
  --accent:#C8102E;--accent-ink:#FFFFFF;--desk:#D9DEE6;
  --f:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1217;--surface:#171C24;--ink:#EDF0F5;--muted:#9BA6B5;--line:#2A323E;
  --accent:#FF6477;--accent-ink:#2A0309;--desk:#0A0D11;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1217;--surface:#171C24;--ink:#EDF0F5;--muted:#9BA6B5;--line:#2A323E;
  --accent:#FF6477;--accent-ink:#2A0309;--desk:#0A0D11;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.6;
  padding-block:12px 40px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
h1{font-size:19px;line-height:1.3;margin:0;font-weight:700}
h2{font-size:15px;margin:0;font-weight:700}
.top{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.bar .sp{flex:1}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical}
select:focus-visible,input:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.btn{font:inherit;font-weight:500;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.status{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:99px;background:var(--muted);display:inline-block}
.dot.ok{background:#2E9E5B}.dot.warn{background:#D99A1B}
.err{color:var(--accent)}
.tabs{display:none;gap:4px}
.tabs .btn[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panes{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
.panes[data-pane="edit"] .pv{display:none}
.panes[data-pane="view"] .ed{display:none}
@media (max-width:999px){.tabs{display:flex}}
@media (min-width:1000px){
  .panes{grid-template-columns:minmax(380px,460px) minmax(0,1fr)}
  .panes[data-pane] .pv,.panes[data-pane] .ed{display:flex}
  .pv{position:sticky;top:8px}
}
.ed{display:flex;flex-direction:column;gap:10px;min-width:0}
.pv{flex-direction:column;gap:8px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.form .wide{grid-column:1/-1}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.ihead{display:flex;gap:6px;align-items:center}
.ihead .sp{flex:1}
.chip{font-size:12px;font-weight:700;border-radius:5px;padding:1px 9px}
.hint{margin:0;font-size:12px;color:var(--muted)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pvbox{background:var(--desk);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 110px);overflow-y:auto}
.pgl{font-size:12px;color:var(--muted);margin:0 0 4px}
.pgwrap{position:relative;overflow:hidden;box-shadow:0 1px 8px rgba(0,0,0,.25);background:#fff}
.pgwrap>.paper{position:absolute;left:0;top:0;transform-origin:0 0}
@media (max-width:999px){.pvbox{max-height:none}}
#holder{position:fixed;left:0;top:0;z-index:-1;pointer-events:none;width:1123px}

/* editor extras */
.phrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pcol{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.thumb{width:88px;height:62px;border:1px solid var(--line);border-radius:6px;background:var(--surface) center/contain no-repeat;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.fb{position:relative;cursor:pointer;display:inline-flex;flex-direction:row;align-items:center;color:var(--ink)}
.fb input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.fb:focus-within{outline:2px solid var(--accent);outline-offset:2px}

.trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.trow .tl{min-width:10em;font-size:12px;color:var(--muted)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg .btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.swatches{display:flex;flex-wrap:wrap;gap:12px}
.swatches label{align-items:flex-start}
input[type=color]{width:48px;height:34px;padding:2px;cursor:pointer}
summary h2{display:inline}
/* paper: fixed light colors so print output never changes with the viewer theme */
.paper{width:1123px;min-height:794px;background:#fff;color:#1B2230;padding:28px 32px;font-family:var(--f);line-height:1.5;display:flex;flex-direction:column;gap:14px}
.paper *{box-sizing:border-box}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.pk{font-size:12px;color:#5A6577;letter-spacing:.08em}
.pt{font-size:calc(40px*var(--f-head,1));font-weight:700;line-height:1.3;margin:0;color:#1B2230}
.pm{display:flex;gap:8px}
.pm div{border:1px solid #CBD2DC;border-radius:6px;padding:4px 12px;min-width:110px}
.pm small{display:block;font-size:10px;color:#5A6577}
.pm span{font-size:14px;font-weight:700}
.aim{background:#F3F5F8;border-left:5px solid #1B2230;padding:10px 16px;font-weight:700;line-height:1.4;font-size:calc(22px*var(--f-head,1));white-space:pre-wrap;overflow-wrap:anywhere}
.foot2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.foot2.one{grid-template-columns:1fr}
.fb2{border:1.5px solid #1B2230;border-radius:8px;overflow:hidden;background:#fff}
.fb2 h3{margin:0;padding:5px 12px;background:#1B2230;color:#fff;font-size:calc(13px*var(--f-point,1));letter-spacing:.04em}
.fb2 ul{margin:0;padding:8px 12px 8px 28px;font-size:calc(13px*var(--f-point,1));line-height:1.55;color:#1B2230}.fb2 li{overflow-wrap:anywhere}.fb2 li+li{margin-top:2px}
.aim small{font-size:13px;font-weight:700;margin-bottom:2px;color:#5A6577;display:block}
.flow{position:relative;width:1059px}
.ln{position:absolute;top:0;border-radius:10px}
.lh{position:absolute;top:0;height:30px;border-radius:10px 10px 0 0;font-weight:700;font-size:14px;padding:3px 12px;display:flex;align-items:center;gap:10px}
.lh small{font-weight:500;font-size:12px}
.flow svg{position:absolute;left:0;top:0}
.nd{position:absolute;border:2px solid;border-radius:10px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.nh{display:flex;align-items:baseline;gap:8px;padding:4px 12px;font-weight:700;font-size:16px;line-height:22px}
.nh small{font-size:12px;font-weight:500;opacity:.92}
.nbd{padding:12px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.nt1{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.nt1 .tx{min-width:0;flex:1}
.mk{font-size:calc(14px*var(--f-maker,1));color:#3C4757;font-weight:500;line-height:1.45;overflow-wrap:anywhere}
.md{font-family:var(--mono);font-weight:700;line-height:1.25;overflow-wrap:anywhere;color:#111827}
.pr{font-size:calc(20px*var(--f-price,1));font-weight:700;font-family:var(--mono);line-height:1.4;color:var(--pc,#B0102A)}
.pr small{font-size:11px;font-weight:500;color:#5A6577;margin-left:4px;font-family:var(--f)}
.ft{font-size:calc(14px*var(--f-feat,1));line-height:1.45;color:#2A3646;overflow-wrap:anywhere}
.pt2{font-size:calc(13px*var(--f-point,1));line-height:1.5;background:#F3F5F8;border-radius:6px;padding:6px 10px;overflow-wrap:anywhere;white-space:pre-wrap}
.pt2 small{display:block;font-size:11px;color:#5A6577;font-weight:700}
.pho{flex:none;width:var(--pw,88px);height:var(--ph,62px);border:1px solid #D6DBE3;border-radius:6px;background:#F3F5F8 center/contain no-repeat}
.pill{position:absolute;display:flex;align-items:center;gap:6px;border:2px solid;border-radius:14px;background:#fff;padding:4px 8px 4px 5px;font-size:calc(13px*var(--f-label,1));line-height:calc(17px*var(--f-label,1));font-weight:500;color:#1B2230;overflow-wrap:anywhere;word-break:break-all}
.pill i{font-style:normal;width:var(--pb,28px);height:var(--pb,28px);border-radius:99px;color:#fff;font-size:calc(var(--pb,28px)*.58);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.empty{position:absolute;left:0;right:0;top:40px;text-align:center;color:#5A6577;font-size:15px}
.pf{font-size:11px;color:#5A6577;margin-top:auto}
.h2p{font-size:18px;font-weight:700;margin:0;border-bottom:2px solid #1B2230;padding-bottom:4px}
.lst{display:flex;gap:24px;align-items:flex-start}
.lc{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0}
.rw{display:flex;gap:10px;align-items:flex-start;border:1px solid #D6DBE3;border-radius:10px;padding:10px 12px}
.no{flex:none;width:var(--cn,36px);height:var(--cn,36px);border-radius:99px;font-weight:700;font-size:calc(var(--cn,36px)*.56);display:flex;align-items:center;justify-content:center}
.rb{min-width:0;flex:1;display:flex;flex-direction:column;gap:8px}
.tg{font-size:11px;font-weight:700;border-radius:4px;padding:0 7px;line-height:18px}
.rh{font-size:15px;font-weight:700;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.rh .lb{background:#F3F5F8;border:1px solid #CBD2DC;border-radius:5px;padding:0 8px;font-weight:500;font-size:13px}
.sk{font-size:11px;font-weight:700;border:1px dashed #5A6577;border-radius:5px;padding:0 6px;color:#5A6577}
.hq{background:#FFF6D9;border-left:4px solid #E0A100;border-radius:4px;padding:6px 10px}
.hl{font-size:12px;font-weight:700;color:#5A6577;margin-bottom:2px}
.hq .hl{color:#6B4A00}
.hrow{display:flex;gap:6px;font-size:calc(14px*var(--f-hear,1));line-height:1.5}
.hrow i{font-style:normal;font-weight:700;color:#8A5E00;flex:none}
.tk{font-size:calc(13px*var(--f-talk,1));line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.band{display:grid;grid-template-columns:1fr 1fr;gap:12px}.band.one{grid-template-columns:1fr}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.tc{border:1px solid #D6DBE3;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;min-width:0}
.tch{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:calc(14px*var(--f-label,1));font-weight:700}
.nt{border:1px solid #CBD2DC;border-radius:8px;padding:10px 14px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
</style>

</head>
<body>
<div class="top">
  <div class="bar">
    <h1>戦略メーカー <span style="font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;vertical-align:middle">Ver.1</span></h1>
    <span class="sp"></span>
    <button class="btn" data-act="newplan">新規</button>
    <button class="btn" data-act="sample">サンプル</button>
    <select id="plansel" aria-label="保存した作戦表"></select>
    <button class="btn" data-act="save" id="savebtn">保存</button>
    <button class="btn" data-act="del" id="delbtn">削除</button>
    <button class="btn pri" data-act="pdf" id="pdfbtn">PDFを出力</button>
  </div>
  <div class="status" id="status"></div>
  <div class="tabs"><button class="btn" data-act="pane" data-p="edit" aria-selected="true">作成</button><button class="btn" data-act="pane" data-p="view" aria-selected="false">プレビュー</button></div>
  <div class="panes" id="panes" data-pane="edit">
    <div class="ed" id="ed"></div>
    <div class="pv" id="pv"><div class="pvbox" id="pvbox"></div></div>
  </div>
</div>
<div id="holder"></div>
<datalist id="makers"><option value="シャープ"><option value="ソニー"><option value="パナソニック"><option value="REGZA"><option value="LG"><option value="ハイセンス"></datalist>

<script>
var TIERS=[
 {id:'STD',sub:'アテンション・入口',color:'#E0A100',text:'#3B2A00',tint:'#FFF6D9'},
 {id:'MID',sub:'ステップアップ',color:'#2F6FDB',text:'#FFFFFF',tint:'#E8F0FD'},
 {id:'FLAG',sub:'ゴール・着地',color:'#D62839',text:'#FFFFFF',tint:'#FDE9EC'}
];
var KEYL='tv43plans-v3';
var db=null,dlcap=null,plans=[],local={};
var st={cur:null,pane:'edit',dirty:false,status:'local',canWrite:null,msg:'',err:'',busy:false,touched:false,saved:false};

function $(s){return document.querySelector(s)}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function uid(p){return p+Math.random().toString(36).slice(2,8)}
var DEFC={STD:'#E0A100',MID:'#2F6FDB',FLAG:'#D62839'};
function okHex(h,d){return /^#[0-9a-fA-F]{6}$/.test(h||'')?h:d}
var TKEYS=['maker','model','price','feat','point','label','hear','talk','head'];
function tsOf(d){var o={},t=d.t||{};TKEYS.forEach(function(k){var v=t[k]||d.fs||'m';o[k]=(v==='s'||v==='l')?v:'m'});return o}
function dz(p){var d=(p&&p.design)||{},c=d.c||{};
  return {t:tsOf(d),num:d.num||'m',photo:d.photo||'m',paper:d.paper==='a3'?'a3':'a4',orient:d.orient||'auto',price:okHex(d.price,'#B0102A'),
    c:{STD:okHex(c.STD,DEFC.STD),MID:okHex(c.MID,DEFC.MID),FLAG:okHex(c.FLAG,DEFC.FLAG)}}}
function rgbOf(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function textOn(h){var c=rgbOf(h).map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}),L=.2126*c[0]+.7152*c[1]+.0722*c[2];return L>.4?'#1B2230':'#FFFFFF'}
function tintOf(h){var c=rgbOf(h).map(function(v){return Math.round(v+(255-v)*.88)});return 'rgb('+c.join(',')+')'}
function tier(id){var b=TIERS.filter(function(t){return t.id===id})[0]||TIERS[0],c=dz(st.cur).c[b.id];return {id:b.id,sub:b.sub,color:c,text:textOn(c),tint:tintOf(c)}}
var FSM={s:.85,m:1,l:1.2};
function dzSizes(p){var D=dz(p||st.cur),t={};TKEYS.forEach(function(k){t[k]=FSM[D.t[k]]});
  return {t:t,pb:{s:22,m:28,l:36}[D.num]||28,cn:{s:28,m:36,l:46}[D.num]||36,pw:{s:66,m:88,l:120}[D.photo]||88,ph:{s:46,m:62,l:84}[D.photo]||62}}
function paperVars(p){var z=dzSizes(p),D=dz(p),v=TKEYS.map(function(k){return '--f-'+k+':'+z.t[k]}).join(';');return v+';--pb:'+z.pb+'px;--cn:'+z.cn+'px;--pw:'+z.pw+'px;--ph:'+z.ph+'px;--pc:'+D.price}
function yen(n){return (n===''||n==null||isNaN(Number(n)))?'':'¥'+Number(n).toLocaleString('ja-JP')}
function clone(o){return JSON.parse(JSON.stringify(o))}
function nlabel(n){return n.tier+' '+(n.model||n.name||'（未入力）')}

function samplePlan(){
  return {id:uid('p'),title:'43型 週末コンサル作戦',period:'11/21(土)・11/22(日)',store:'駅前店',author:'店長',
   aim:'安さで入り、使い方で上げる。ゲーム・映画の相談はFLAGへ。配信の相談はMIDで音と画質を比べる。',
   nodes:[
    {id:'n1',tier:'STD',maker:'シャープ',model:'AQ-43S1',name:'43型 4K 標準',price:54800,point:'今週の目玉。まず大画面の価格で足を止める。',photo:''},
    {id:'n2',tier:'STD',maker:'シャープ',model:'AQ-43S2',name:'43型 4K 録画対応',price:59800,point:'録画したい人の入口。',photo:''},
    {id:'n3',tier:'MID',maker:'パナソニック',model:'VX-43P3',name:'43型 4K 配信と音',price:79800,point:'配信と音の差を、実機で並べて比べる。',photo:''},
    {id:'n4',tier:'FLAG',maker:'ソニー',model:'KD-43B5',name:'43型 4K 120Hz ゲーム',price:109800,point:'ゲーム機があるなら迷わずこれ。',photo:''},
    {id:'n5',tier:'FLAG',maker:'ソニー',model:'KD-43B4',name:'43型 4K 高画質',price:98000,point:'映画や配信を、暗い場面で見せる。',photo:''}
   ],
   edges:[
    {id:'e1',from:'n1',to:'n3',label:'配信を見る',hearing:'ふだん動画は何で見ますか？\n今のテレビで、映像や音に不満はありますか？',talk:'配信が多いと分かったら、画面の綺麗さと音の差を並べて見せる。'},
    {id:'e2',from:'n3',to:'n5',label:'映画が好き',hearing:'好きな映画のジャンルは何ですか？\n夜に暗い部屋で見ることは多いですか？',talk:'暗い場面の映像で画質差を体感してもらう。差額は月あたりで伝える。'},
    {id:'e3',from:'n1',to:'n4',label:'ゲームする',hearing:'ゲーム機は何をお持ちですか？',talk:'MIDは飛ばしてFLAGへ。120Hzと低遅延を触ってもらう。'},
    {id:'e4',from:'n2',to:'n3',label:'録画も使う',hearing:'録画は週にどのくらいしますか？\n配信と録画、どちらをよく見ますか？',talk:'録画の使い方を聞き、HDDとあわせて配信機能の便利さを見せる。'},
    {id:'e5',from:'n3',to:'n4',label:'ゲーム機あり',hearing:'ゲームは、どのくらいの頻度で遊びますか？',talk:'配信より先にゲーム機の機種を聞き、FLAGの低遅延へつなぐ。'}
   ],
   notes:'・土曜の午前は混むので、まずSTDで声かけを優先する。\n・FLAGの値引きは店長承認。\n・延長保証5年を必ず一言添える。',
   acc:'・HDMIケーブルを必ず提案する\n・壁掛け金具・テレビ台は設置場所を聞いてから\n・リモコン用の電池をサービスで付ける',
   s4:'・設置まで含めて金額を伝える\n・下取り・リサイクル回収の有無を確認する\n・購入後の使い方レクチャーを案内する',updated:0};
}
function blankPlan(){return {id:uid('p'),title:'',period:'',store:'',author:'',aim:'',nodes:[],edges:[],notes:'',acc:'',s4:'',accT:'付帯品',s4T:'S4',updated:0}}

/* ---------- layout and sheet ---------- */
var mz=null;
function nodeHtml(n,w,x,y,h){
  var t=tier(n.tier),ms=String(n.model||'(型番)'),fs=Math.round((ms.length>9?18:ms.length>7?21:24)*dzSizes().t.model);

  var price=yen(n.price);
  return '<div class="nd" style="'+pos+'border-color:'+t.color+'">'+
   '<div class="nbd"><div class="nt1"><div class="tx"><div class="mk">'+esc(n.maker||'メーカー未入力')+'</div>'+
   '<div class="md" style="font-size:'+fs+'px">'+esc(ms)+'</div>'+
   '<div class="pr">'+(price||'価格未入力')+(price?'<small>税込</small>':'')+'</div></div>'+

function measureNode(nd,w){
  try{
    if(!mz){mz=document.createElement('div');mz.className='paper';mz.setAttribute('aria-hidden','true');
      mz.style.cssText='position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;width:1123px;min-height:0;padding:0;z-index:-1;display:block';
      document.body.appendChild(mz)}
    mz.style.cssText='position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;width:1123px;min-height:0;padding:0;z-index:-1;display:block;'+paperVars(st.cur);
    mz.innerHTML=nodeHtml(nd,w,null,null,0);
    return Math.ceil(mz.firstElementChild.getBoundingClientRect().height)+1;
  }catch(e){return 200}
}
function layout(p){
  var cols=TIERS.filter(function(t){return p.nodes.some(function(n){return n.tier===t.id})}).map(function(t){return tier(t.id)}),n=cols.length||1,pad=14,inner=1059-2*pad;
  var nodeW=n===1?420:n===2?330:236,G=n>1?(inner-n*nodeW)/(n-1):0,TOP=44,GAP=22,map={},bottom=TOP;
  cols.forEach(function(t,ci){
    var x=n===1?(1059-nodeW)/2:pad+ci*(nodeW+G),y=TOP;
    p.nodes.filter(function(q){return q.tier===t.id}).forEach(function(nd){
      var h=measureNode(nd,nodeW);map[nd.id]={nd:nd,ci:ci,x:x,y:y,w:nodeW,h:h};y+=h+GAP});
    bottom=Math.max(bottom,y-GAP);
  });
  return {cols:cols,n:n,nodeW:nodeW,G:G,map:map,flowH:bottom+16};
}
function cub(a,b,c,d,t){var u=1-t;return u*u*u*a+3*u*u*t*b+3*u*t*t*c+t*t*t*d}
function yAtX(q,x){var best=0,bd=1e9;for(var i=0;i<=80;i++){var t=i/80,d=Math.abs(cub(q[0],q[2],q[4],q[6],t)-x);if(d<bd){bd=d;best=t}}return cub(q[1],q[3],q[5],q[7],best)}
function edgeGeoms(p,L){
  var list=[],cnt={},tot={};
  p.edges.forEach(function(e,i){
    var a=L.map[e.from],b=L.map[e.to];if(!a||!b||a===b)return;
    var dir=b.ci>a.ci?1:(b.ci<a.ci?-1:0);
    list.push({e:e,i:i,a:a,b:b,dir:dir,sa:dir>=0?'R':'L',sb:dir>0?'L':'R',skip:Math.abs(b.ci-a.ci)>1});
  });
  list.forEach(function(g){var ka=g.a.nd.id+g.sa,kb=g.b.nd.id+g.sb;tot[ka]=(tot[ka]||0)+1;tot[kb]=(tot[kb]||0)+1});
  list.forEach(function(g){
    var ka=g.a.nd.id+g.sa,kb=g.b.nd.id+g.sb;
    var ia=(cnt[ka]=(cnt[ka]===undefined?0:cnt[ka]+1)),ib=(cnt[kb]=(cnt[kb]===undefined?0:cnt[kb]+1));
    var oa=(ia-(tot[ka]-1)/2)*16,ob=(ib-(tot[kb]-1)/2)*16;
    var x1=g.sa==='R'?g.a.x+g.a.w:g.a.x,y1=g.a.y+g.a.h/2+oa;
    var x2=g.sb==='R'?g.b.x+g.b.w:g.b.x,y2=g.b.y+g.b.h/2+ob;
    var c1x,c2x,dx;
    if(g.dir>0){dx=Math.max(40,(x2-x1)*.5);c1x=x1+dx;c2x=x2-dx}
    else if(g.dir<0){dx=Math.max(40,(x1-x2)*.5);c1x=x1-dx;c2x=x2+dx}
    else{c1x=x1+70;c2x=x2+70}
    g.p=[x1,y1,c1x,y1,c2x,y2,x2,y2];
    g.my=cub(y1,y1,y2,y2,.5);
    g.lx=g.dir>0?g.a.x+g.a.w+L.G/2:(g.dir<0?g.a.x-L.G/2:x1+60);
    g.ly=g.dir===0?g.my:yAtX(g.p,g.lx);
  });
  return list;
}
function sheetFlow(p){
  if(!p.nodes.length)return '<div class="flow" style="height:160px"><div class="empty">作成画面で機種を追加すると、ここにコンサルの流れが出ます。</div></div>';
  var L=layout(p),G=edgeGeoms(p,L),h='';
  L.cols.forEach(function(t,ci){
    var lx=L.n===1?0:14+ci*(L.nodeW+L.G)-14,lw=L.n===1?1059:L.nodeW+28;
    h+='<div class="ln" style="left:'+lx+'px;width:'+lw+'px;height:'+L.flowH+'px;background:'+t.tint+'"></div>'+
       '<div class="lh" style="left:'+lx+'px;width:'+lw+'px;background:'+t.color+';color:'+t.text+'">'+t.id+'<small>'+t.sub+'</small></div>';
  });
  var svg='<svg width="1059" height="'+L.flowH+'" viewBox="0 0 1059 '+L.flowH+'">';
  G.forEach(function(g){
    var c=tier(g.b.nd.tier).color,q=g.p;
    svg+='<path d="M'+q[0]+' '+q[1]+' C'+q[2]+' '+q[3]+' '+q[4]+' '+q[5]+' '+q[6]+' '+q[7]+'" fill="none" stroke="'+c+'" stroke-width="3"'+(g.skip?' stroke-dasharray="8 6"':'')+'/>';
    var tx=q[6]-q[4],ty=q[7]-q[5],m=Math.sqrt(tx*tx+ty*ty)||1;tx/=m;ty/=m;
    var bx=q[6]-13*tx,by=q[7]-13*ty,nx=-ty*6.5,ny=tx*6.5;
    svg+='<polygon points="'+q[6]+','+q[7]+' '+(bx+nx)+','+(by+ny)+' '+(bx-nx)+','+(by-ny)+'" fill="'+c+'"/>';
  });
  svg+='</svg>';
  h+=svg;
  Object.keys(L.map).forEach(function(k){var o=L.map[k];h+=nodeHtml(o.nd,o.w,o.x,o.y,o.h)});
  var placed=[];
  G.forEach(function(g){
    var lab=String(g.e.label||''),c=tier(g.b.nd.tier).color,len=lab.length;
    var Z=dzSizes(),FS=Z.t.label,PB=Z.pb,cw=13.5*FS,lh=17*FS;
    var maxW=L.G>0?Math.min(L.G-12,150):150,need=len?len*cw+PB+26:PB+16,w=Math.max(PB+16,Math.min(maxW,Math.round(need)));
    var per=Math.max(2,Math.floor((w-PB-26)/cw)),lines=len?Math.ceil(len/per):1,hh=Math.max(PB+10,lines*lh+10);
    var cx=g.dir===0?(g.p[0]+52+w/2):g.lx,cy=g.ly;
    var x=Math.max(0,Math.min(1059-w,cx-w/2)),y=cy-hh/2,tries=0,hit;
    function clash(r){return x<r.x+r.w+4&&r.x<x+w+4&&y<r.y+r.h+4&&r.y<y+hh+4}
    while(tries<14&&(hit=placed.filter(clash)[0])){y=hit.y+hit.h+6;tries++}
    placed.push({x:x,y:y,w:w,h:hh});
    h+='<div class="pill" style="left:'+x+'px;top:'+y+'px;width:'+w+'px;min-height:'+hh+'px;border-color:'+c+'"><i style="background:'+c+'">'+(g.i+1)+'</i>'+esc(lab)+'</div>';
  });
  return '<div class="flow" style="height:'+L.flowH+'px">'+h+'</div>';
}
function talkCards(p){
  var tc=tierCols(p),byId={},cards=[];p.nodes.forEach(function(n){byId[n.id]=n});
  p.edges.forEach(function(e,i){
    var a=byId[e.from],b=byId[e.to];if(!a||!b||a===b)return;
    var ta=tier(a.tier),tb=tier(b.tier),skip=Math.abs(tc.indexOf(b.tier)-tc.indexOf(a.tier))>1;
    var step=a.tier==='STD'&&b.tier==='MID';
    var hear=String(e.hearing||'').split('\n').map(function(x){return x.trim()}).filter(Boolean);
    cards.push('<div class="tc"><div class="tch"><span class="no" style="background:'+tb.color+';color:'+tb.text+'">'+(i+1)+'</span>'+
      '<span class="tg" style="background:'+ta.color+';color:'+ta.text+'">'+a.tier+'</span>'+esc(a.model||a.name||'(未入力)')+'<span>→</span>'+
      '<span class="tg" style="background:'+tb.color+';color:'+tb.text+'">'+b.tier+'</span>'+esc(b.model||b.name||'(未入力)')+'</div>'+
      ((e.label||skip)?'<div class="tch">'+(e.label?'<span class="lb">'+esc(e.label)+'</span>':'')+(skip?'<span class="sk">途中の段を飛ばす</span>':'')+'</div>':'')+
      (hear.length?'<div class="hq"><div class="hl">'+(step?'ステップアップのヒアリング（STD→MID）':'ヒアリング')+'</div>'+hear.map(function(x,k){return '<div class="hrow"><i>Q'+(k+1)+'</i><span>'+esc(x)+'</span></div>'}).join('')+'</div>':'')+
      (e.talk?'<div><div class="hl">コンサルのしかた</div><div class="tk">'+esc(e.talk)+'</div></div>':'')+'</div>');
  });
  return cards;
}
function tierCols(p){return TIERS.filter(function(t){return p.nodes.some(function(n){return n.tier===t.id})}).map(function(t){return t.id})}
function bullets(t){return String(t||'').split(/\n/).map(function(x){return x.replace(/^\s*[・･•\-\*]\s*/,'').trim()}).filter(Boolean)}

function flowPages(p){
  var rest=talkCards(p).slice(6),pages=[],per=9;
  for(var k=0;k<rest.length;k+=per)pages.push(rest.slice(k,k+per));
  return pages.map(function(list,pi){
    return '<div class="paper" style="'+paperVars(p)+'"><div class="ph"><div><div class="pk">'+esc(p.title||'')+'</div><h2 class="pt" style="font-size:24px">コンサルトーク（続き'+(pages.length>1?' '+(pi+1)+'/'+pages.length:'')+'）</h2></div></div><div class="tgrid">'+list.join('')+'</div></div>';
  });
}
function pagesHtml(p){return [pageOne(p)].concat(flowPages(p))}

function tRows(D){
  var SZ=[['s','小'],['m','中'],['l','大']];
  var same=TKEYS.every(function(k){return D.t[k]===D.t.maker}),cur=same?D.t.maker:'';
  var all='<div class="trow"><span class="tl"><b>すべてまとめて</b></span><div class="seg">'+SZ.map(function(it){return '<button class="btn sm" data-act="dzall" data-v="'+it[0]+'" aria-pressed="'+(cur===it[0])+'">'+it[1]+'</button>'}).join('')+'</div></div>';
  return '<div style="display:flex;flex-direction:column;gap:6px">'+all+TROWS.map(function(r){
    return '<div class="trow"><span class="tl">'+r[1]+'</span><div class="seg">'+SZ.map(function(it){return '<button class="btn sm" data-act="dzt" data-k="'+r[0]+'" data-v="'+it[0]+'" aria-pressed="'+(D.t[r[0]]===it[0])+'">'+it[1]+'</button>'}).join('')+'</div></div>'}).join('')+'</div>';
}
function designCard(){
  var p=st.cur,D=dz(p),SZ=[['s','小'],['m','中'],['l','大']];
  function seg(k,items){return '<div class="seg" role="group">'+items.map(function(it){return '<button class="btn sm" data-act="dz" data-k="'+k+'" data-v="'+it[0]+'" aria-pressed="'+(D[k]===it[0])+'">'+it[1]+'</button>'}).join('')+'</div>'}
  function sw(id,label,val,attr){return '<label>'+label+'<input type="color" '+attr+'="'+id+'" value="'+val+'"></label>'}
  return '<details class="card" id="adv"'+(st.adv?' open':'')+'><summary><h2>詳細設定（デザイン・用紙）</h2></summary><div class="form">'+
   '<div class="wide"><span class="hint">文字の大きさ（項目ごとに選べます）</span>'+tRows(D)+'</div>'+
   '<div class="wide"><span class="hint">矢印の番号の大きさ</span>'+seg('num',SZ)+'</div>'+
   '<div class="wide"><span class="hint">写真の大きさ</span>'+seg('photo',SZ)+'</div>'+
   '<div class="wide"><span class="hint">用紙</span>'+seg('paper',[['a4','A4'],['a3','A3']])+'</div>'+
   '<div class="wide"><span class="hint">用紙の向き</span>'+seg('orient',[['auto','自動'],['land','横'],['port','縦']])+'</div>'+
   '<div class="wide"><span class="hint">色</span><div class="swatches">'+sw('STD','STD',D.c.STD,'data-dzc')+sw('MID','MID',D.c.MID,'data-dzc')+sw('FLAG','FLAG',D.c.FLAG,'data-dzc')+sw('price','価格',D.price,'data-dzp')+'</div></div>'+
   '<div class="wide"><span class="hint">色の組み合わせ</span><div class="seg">'+PRESETS.map(function(x,i){return '<button class="btn sm" data-act="preset" data-i="'+i+'">'+x[0]+'</button>'}).join('')+'<button class="btn sm" data-act="dzreset">すべて初期値に戻す</button></div></div>'+
  '</div></details>';
}
function refreshEdgeLabels(){
  [].forEach.call(document.querySelectorAll('select[data-f=from],select[data-f=to]'),function(s){
    [].forEach.call(s.options,function(o){var n=st.cur.nodes.filter(function(x){return x.id===o.value})[0];if(n)o.textContent=nlabel(n)});
  });
}

/* ---------- plans: storage ---------- */
function canSave(){return st.canWrite!==false}
function renderBar(){
  var sel=$('#plansel'),list=plans.slice().sort(function(a,b){return (b.updated||0)-(a.updated||0)});
  var inList=list.some(function(x){return x.id===st.cur.id});
  var o=(!inList?'<option value="'+st.cur.id+'" selected>'+esc(st.cur.title||'新しい作戦表')+'（未保存）</option>':'')+
    list.map(function(x){return '<option value="'+x.id+'"'+(x.id===st.cur.id?' selected':'')+'>'+esc(x.title||'無題')+(x.period?' / '+esc(x.period):'')+'</option>'}).join('');
  sel.innerHTML=o;
  $('#savebtn').disabled=!canSave();$('#delbtn').disabled=!canSave()||!inList;$('#pdfbtn').disabled=st.busy;
  var m={ok:['ok','店舗間で共有して保存します'],wait:['warn','共有データに接続中です'],fail:['warn','共有データに接続できません。保存はできない場合があります'],local:['warn','この端末にだけ保存します']}[st.status];
  $('#status').innerHTML='<span class="dot '+m[0]+'"></span>'+m[1]+(st.dirty?' / 未保存の変更があります':'')+
   (st.canWrite===false?' / 閲覧のみ（保存できません）':'')+(st.msg?' / '+esc(st.msg):'')+(st.err?' <span class="err">'+esc(st.err)+'</span>':'');
}
function loadPlan(p){st.cur=clone(p);st.dirty=false;st.msg='';st.err='';renderEditor();renderPreview();renderBar()}
function persistLocal(){try{localStorage.setItem(KEYL,JSON.stringify(local))}catch(e){}}
function savePlan(){
  if(!canSave())return;
  var p=clone(st.cur);p.updated=Date.now();st.cur.updated=p.updated;st.err='';
  if(db&&new Blob([JSON.stringify(p)]).size>250*1024){st.err='データが大きすぎて共有保存できません。写真の数を減らしてください。';renderBar();return}
  if(db){
    db.doc('plans/'+p.id).set(p).then(function(){st.dirty=false;st.msg='保存しました';renderBar()}).catch(function(e){st.err='保存できませんでした（'+((e&&e.code)||'error')+'）';renderBar()});
  }else{
    local[p.id]=p;plans=Object.keys(local).map(function(k){return local[k]});persistLocal();st.dirty=false;st.msg='保存しました';renderBar();
  }
}
function deletePlan(){
  var id=st.cur.id;
  if(db){db.doc('plans/'+id).delete().then(function(){st.msg='削除しました'}).catch(function(e){st.err='削除できませんでした（'+((e&&e.code)||'error')+'）';renderBar()})}
  else{delete local[id];plans=Object.keys(local).map(function(k){return local[k]});persistLocal();st.msg='削除しました'}
  var rest=plans.filter(function(x){return x.id!==id});
  if(rest.length)loadPlan(rest.sort(function(a,b){return (b.updated||0)-(a.updated||0)})[0]);else loadPlan(blankPlan());
}

/* ---------- PDF ---------- */
async function exportPdf(){
  if(st.busy)return;
  if(!window.html2canvas||!window.jspdf){st.err='PDFの部品を読み込めていません。再読み込みしてください。';renderBar();return}
  st.busy=true;st.err='';st.msg='PDFを作成中…';renderBar();
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    var pages=pagesHtml(st.cur),holder=$('#holder');
    var doc=null;
    for(var i=0;i<pages.length;i++){
      holder.innerHTML=pages[i];
      var cv=await window.html2canvas(holder.firstElementChild,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:1200});
      var D=dz(st.cur),LW=D.paper==='a3'?1191:842,SW=D.paper==='a3'?842:595;
      var land=D.orient==='land'?true:(D.orient==='port'?false:Math.min(LW/cv.width,SW/cv.height)>=Math.min(SW/cv.width,LW/cv.height)),ori=land?'landscape':'portrait';
      if(!doc)doc=new window.jspdf.jsPDF({orientation:ori,unit:'pt',format:D.paper});else doc.addPage(D.paper,ori);
      var PW=doc.internal.pageSize.getWidth(),PH=doc.internal.pageSize.getHeight();
      var r=Math.min(PW/cv.width,PH/cv.height),w=cv.width*r,h=cv.height*r;
      doc.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',(PW-w)/2,0,w,h);
    }
    holder.innerHTML='';
    var name=((st.cur.title||'作戦表')+(st.cur.period?'_'+st.cur.period:'')).replace(/[\\\/:*?"<>|\s]+/g,'_')+'.pdf';
    var blob=doc.output('blob');
    if(dlcap){await dlcap.save({filename:name,data:blob})}
    else{var an=document.createElement('a');an.href=URL.createObjectURL(blob);an.download=name;document.body.appendChild(an);an.click();an.remove();setTimeout(function(){URL.revokeObjectURL(an.href)},5000)}
    st.msg='PDFを保存しました';
  }catch(e){
    $('#holder').innerHTML='';
    st.msg='';
    st.err=(e&&e.code==='declined')?'PDFの保存を取りやめました。':'PDFを作れませんでした。'+(e&&e.message?'（'+e.message+'）':'');
  }
  st.busy=false;renderBar();
}

/* ---------- events ---------- */
function moveIn(arr,id,dir,same){
  var i=arr.findIndex(function(x){return x.id===id});if(i<0)return;
  var j=i+dir;while(j>=0&&j<arr.length&&same&&arr[j].tier!==arr[i].tier)j+=dir;
  if(j<0||j>=arr.length)return;var t=arr[i];arr[i]=arr[j];arr[j]=t;
}
function changed(){st.dirty=true;st.touched=true;st.msg='';renderBar();schedulePreview()}
document.addEventListener('input',function(e){
  var t=e.target,p=st.cur;if(!t.dataset)return;
  if(t.dataset.dzc||t.dataset.dzp){
    p.design=Object.assign({},p.design||{});
    if(t.dataset.dzc){p.design.c=Object.assign({},p.design.c||{});p.design.c[t.dataset.dzc]=t.value}else{p.design.price=t.value}
    changed();return;
  }
  if(t.dataset.k){p[t.dataset.k]=t.value;changed();return}
  if(t.dataset.nid){
    var n=p.nodes.filter(function(x){return x.id===t.dataset.nid})[0];if(!n)return;
    var f=t.dataset.f;n[f]=f==='price'?(t.value===''?'':Number(t.value)):t.value;
    changed();
    if(f==='tier'){renderEditor()}else if(f==='model'||f==='name'){refreshEdgeLabels()}
    return;
  }
  if(t.dataset.eid){
    var g=p.edges.filter(function(x){return x.id===t.dataset.eid})[0];if(!g)return;
    g[t.dataset.f]=t.value;changed();
    if(t.dataset.f==='from'||t.dataset.f==='to')renderEditor();
  }
});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var a=b.dataset.act,p=st.cur,id=b.dataset.id;
  if(a==='pane'){
    st.pane=b.dataset.p;$('#panes').dataset.pane=st.pane;
    [].forEach.call(document.querySelectorAll('.tabs .btn'),function(x){x.setAttribute('aria-selected',x.dataset.p===st.pane)});
    if(st.pane==='view')setTimeout(fit,0);return;
  }
  if(a==='newplan'){loadPlan(blankPlan());return}
  if(a==='sample'){loadPlan(samplePlan());return}
  if(a==='save'){savePlan();return}
  if(a==='del'){deletePlan();return}
  if(a==='pdf'){exportPdf();return}
  if(a==='nadd'){p.nodes.push({id:uid('n'),tier:b.dataset.t,maker:'',model:'',name:'',price:'',point:'',photo:''})}
  else if(a==='ndel'){p.nodes=p.nodes.filter(function(x){return x.id!==id});p.edges=p.edges.filter(function(x){return x.from!==id&&x.to!==id})}
  else if(a==='nup'){moveIn(p.nodes,id,-1,true)}
  else if(a==='ndown'){moveIn(p.nodes,id,1,true)}
  else if(a==='dz'){p.design=Object.assign({},p.design||{});p.design[b.dataset.k]=b.dataset.v}
  else if(a==='dzt'){p.design=Object.assign({},p.design||{});p.design.t=Object.assign({},dz(p).t);p.design.t[b.dataset.k]=b.dataset.v}
  else if(a==='dzall'){p.design=Object.assign({},p.design||{});var tt={};TKEYS.forEach(function(k){tt[k]=b.dataset.v});p.design.t=tt}
  else if(a==='preset'){p.design=Object.assign({},p.design||{});p.design.c=Object.assign({},PRESETS[+b.dataset.i][1])}
  else if(a==='dzreset'){delete p.design}
  else if(a==='pdel'){var pn=p.nodes.filter(function(x){return x.id===id})[0];if(pn)pn.photo=''}
  else if(a==='eadd'){p.edges.push({id:uid('e'),from:p.nodes[0].id,to:p.nodes[Math.min(1,p.nodes.length-1)].id,label:'',hearing:'',talk:''})}
  else if(a==='edel'){p.edges=p.edges.filter(function(x){return x.id!==id})}
  else if(a==='eup'){moveIn(p.edges,id,-1,false)}
  else if(a==='edown'){moveIn(p.edges,id,1,false)}
  else return;
  changed();renderEditor();
});
function attachPhoto(id,file){
  if(!file||!/^image\//.test(file.type)){st.err='画像ファイルを選んでください。';renderBar();return}
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){
    var m=360,sc=Math.min(1,m/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*sc)),h=Math.max(1,Math.round(img.height*sc));
    var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
    var n=st.cur.nodes.filter(function(q){return q.id===id})[0];
    if(n){n.photo=c.toDataURL('image/jpeg',0.72);st.err='';changed();renderEditor()}
    URL.revokeObjectURL(url);
  };
  img.onerror=function(){URL.revokeObjectURL(url);st.err='写真を読み込めませんでした。JPEGかPNGを選んでください。';renderBar()};
  img.src=url;
}
document.addEventListener('toggle',function(e){if(e.target&&e.target.id==='adv')st.adv=e.target.open},true);
document.addEventListener('change',function(e){
  var t=e.target;
  if(t&&t.dataset&&(t.dataset.dzc||t.dataset.dzp)){renderEditor();return}
  if(t&&t.dataset&&t.dataset.photo){var f=t.files&&t.files[0];if(f)attachPhoto(t.dataset.photo,f);t.value=''}
});
$('#plansel').addEventListener('change',function(e){
  var x=plans.filter(function(q){return q.id===e.target.value})[0];
  if(x)loadPlan(x);
});

/* ---------- start ---------- */
st.cur=samplePlan();
renderEditor();renderPreview();renderBar();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){schedulePreview()});

(async function init(){
  var loaded=false;
  try{if(window.claude&&window.claude.use){dlcap=await window.claude.use('downloads');db=await window.claude.use('db')}}catch(e){}
  if(!db){
    try{local=JSON.parse(localStorage.getItem(KEYL)||'{}')}catch(e){local={}}
    plans=Object.keys(local).map(function(k){return local[k]});
    st.status='local';
    if(plans.length)loadPlan(plans.slice().sort(function(a,b){return (b.updated||0)-(a.updated||0)})[0]);else renderBar();
    return;
  }
  st.status='wait';renderBar();
  try{var user=await window.claude.use('user');if(user&&user.can){var c=await Promise.resolve(user.can('data.write'));if(c===false){st.canWrite=false;renderBar()}}}catch(e){}
  var timer=setTimeout(function(){if(!loaded){st.status='fail';renderBar()}},10000);
  db.collection('plans').onSnapshot(function(snap){
    loaded=true;clearTimeout(timer);st.status='ok';
    plans=snap.docs.map(function(d){return d.data()});
    var first=!st.firstDone;st.firstDone=true;
    if(first&&!st.touched&&plans.length){loadPlan(plans.slice().sort(function(a,b){return (b.updated||0)-(a.updated||0)})[0])}
    else renderBar();
  },function(){loaded=true;clearTimeout(timer);st.status='fail';renderBar()});
})();
</script>
